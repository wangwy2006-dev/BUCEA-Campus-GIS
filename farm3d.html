<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开心农场 · 三维智慧农业实验场</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
<style>
html,body,#farm{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei",sans-serif;background:#bfe7ff}.panel{position:absolute;z-index:10;top:14px;left:14px;max-width:390px;padding:14px 16px;border-radius:16px;background:#16372fea;color:#fff;box-shadow:0 10px 34px #0003;backdrop-filter:blur(5px)}.panel h1{font-size:21px;margin:0 0 6px}.panel p{font-size:13px;line-height:1.55;margin:5px 0;color:#def5ea}.panel button,.tour button{margin:7px 5px 0 0;padding:8px 11px;border:0;border-radius:9px;background:#fff;color:#17352e;cursor:pointer}.status{position:absolute;z-index:10;right:14px;top:14px;width:238px;padding:12px 14px;border-radius:13px;background:#102b25df;color:#fff;font-size:13px;line-height:1.8}.tour{position:absolute;z-index:10;right:14px;bottom:14px;padding:10px 12px;border-radius:12px;background:#102b25df;color:#fff;font-size:12px}.legend{position:absolute;z-index:10;left:14px;bottom:14px;padding:10px 13px;border-radius:10px;background:#102b25df;color:#fff;font-size:12px}@media(max-width:760px){.status{top:auto;bottom:14px;right:14px;width:205px}.legend{display:none}.tour{display:none}.panel{max-width:310px}}
</style></head><body>
<div id="farm"></div>
<div class="panel"><h1>🌻 开心农场 · 虚拟三维场景</h1><p>不是地球上的简单图层，而是一座可自由观察的“校园智慧农场小世界”：田垄、温室、水塘、果园、农舍、风车与智慧设施共同构成完整景观。</p><button onclick="location.href='index.html'">⌂ 学校首页</button><button onclick="location.href='gis.html'">校园 GIS</button><button onclick="goView('overview')">全景</button></div>
<div class="status" id="status"><b>智慧农场 · 实时模拟</b><br>🌡️ 23.6 °C　💧 42 %<br>☀️ 680 lx　🌬️ 2.1 m/s<br>🚿 自动灌溉：待机</div>
<div class="legend">🌾 田园生产区　🏡 温室与农舍　💧 水景灌溉区　🌳 果园林带　⚙ 智慧农业设施</div>
<div class="tour">场景导览<br><button onclick="goView('fields')">田野</button><button onclick="goView('greenhouse')">温室</button><button onclick="goView('pond')">水塘</button><button onclick="goView('orchard')">果园</button></div>
<script>
try{
const viewer=new Cesium.Viewer('farm',{baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false});
const scene=viewer.scene;scene.backgroundColor=Cesium.Color.fromCssColorString('#bfe7ff');scene.globe.show=true;scene.globe.baseColor=Cesium.Color.fromCssColorString('#86b96f');scene.globe.depthTestAgainstTerrain=false;scene.screenSpaceCameraController.enableCollisionDetection=false;scene.screenSpaceCameraController.minimumZoomDistance=35;
const L=116.2820,A=39.7448,C=Cesium.Color.fromCssColorString;
function pos(x,y,z=0){return Cesium.Cartesian3.fromDegrees(L+x/85000,A+y/111000,z)}
function box(x,y,w,h,z,color,outline=false,alpha=1){viewer.entities.add({position:pos(x,y,z/2+.25),box:{dimensions:new Cesium.Cartesian3(w,h,z),material:C(color).withAlpha(alpha),outline,outlineColor:Cesium.Color.WHITE.withAlpha(.5)}})}
function cyl(x,y,z,r,color,top=.75){viewer.entities.add({position:pos(x,y,z/2+.45),cylinder:{length:z,topRadius:r*top,bottomRadius:r,material:C(color)}})}
function ball(x,y,z,rx,ry,rz,color,alpha=1){viewer.entities.add({position:pos(x,y,z),ellipsoid:{radii:new Cesium.Cartesian3(rx,ry,rz),material:C(color).withAlpha(alpha)}})}
function label(x,y,z,text){viewer.entities.add({position:pos(x,y,z),label:{text,font:'bold 14px sans-serif',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:C('#17352e').withAlpha(.78),pixelOffset:new Cesium.Cartesian2(0,-16),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,900)}})}
function tree(x,y,s=1,color='#4d8b46'){cyl(x,y,5*s,.7*s,'#70523a');ball(x,y,8*s,3.6*s,3.6*s,4.6*s,color)}
function fenceLine(x1,y1,x2,y2,n){for(let i=0;i<=n;i++){const t=i/n;cyl(x1+(x2-x1)*t,y1+(y2-y1)*t,3.4,.42,'#76523a')}}
box(0,0,290,215,3,'#617b47');box(0,0,270,198,2,'#99c76d');
ball(-112,73,3,36,28,8,'#79ae5d');ball(106,72,3,34,26,7,'#7fb761');ball(110,-72,3,32,25,7,'#78aa5c');ball(-113,-70,3,34,25,6,'#86ba67');
box(0,-91,44,16,1.2,'#d7bd88');box(0,-48,11,82,1.1,'#dbc28d');box(0,12,11,56,1.1,'#dbc28d');box(0,50,222,9,1.1,'#dbc28d');box(-60,-5,8,168,1.1,'#d7bd88');box(62,-5,8,168,1.1,'#d7bd88');
box(-14,-88,6,6,14,'#e7d9ba');box(14,-88,6,6,14,'#e7d9ba');box(0,-88,22,3,3,'#6e4b34');label(0,-88,19,'开心农场');
const beds=[[-92,30,'向日葵田','#6d452a','#f2c84b'],[-31,30,'生态菜园','#684126','#61a84e'],[-92,-33,'玉米田','#6d452a','#9cc84a'],[-31,-33,'番茄田','#6d452a','#d95a45']];
beds.forEach((b,i)=>{box(b[0],b[1],45,47,2.2,b[3]);for(let r=-3;r<=3;r++){box(b[0],b[1]+r*5.8,41,2.1,.65,'#8a6038');for(let c=-4;c<=4;c++){const xx=b[0]+c*4.5,yy=b[1]+r*5.8;if(i===0){cyl(xx,yy,5.1,.72,'#56843f');ball(xx,yy,6.4,1.65,1.65,.7,'#f0c849')}else if(i===2){cyl(xx,yy,6.8,.7,'#78a942');ball(xx,yy,7.1,1.4,1.4,2.4,'#9dc54d')}else{cyl(xx,yy,2.7,.7,b[4]);ball(xx,yy,3.3,1.5,1.5,1.1,b[4])}}}label(b[0],b[1],10,b[2])});
box(33,31,49,48,1.3,'#b98b59');[-14,0,14].forEach(d=>{viewer.entities.add({position:pos(33+d,31,9),box:{dimensions:new Cesium.Cartesian3(11,39,16),material:C('#dff7f1').withAlpha(.28),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.8)}});ball(33+d,31,17,5.5,19.5,5.2,'#dff7f1',.22)});label(33,31,27,'智慧温室群');
for(let i=0;i<4;i++){viewer.entities.add({position:pos(74+i*9,63,5),box:{dimensions:new Cesium.Cartesian3(7,4,.7),material:C('#355d7a'),outline:true,outlineColor:C('#9bc9e5')}})}label(88,63,11,'光伏能源区');
viewer.entities.add({position:pos(95,-34,.8),ellipse:{semiMajorAxis:29,semiMinorAxis:22,material:C('#55b8d5').withAlpha(.95),outline:true,outlineColor:C('#d8f5ff')}});ball(105,-30,1.4,7,5,1.8,'#8fc86a');box(82,-34,4,49,1.1,'#bd935f');box(66,-62,42,4,1.1,'#55a9cf');box(48,-62,4,48,1.1,'#55a9cf');box(77,-66,14,11,9,'#dfc694',true);label(95,-34,8,'生态水塘');label(77,-66,14,'水泵房');
for(let r=0;r<4;r++)for(let c=0;c<5;c++){const x=20+c*9.5,y=-18-r*11;tree(x,y,.95,(r+c)%3===0?'#5d984d':((r+c)%3===1?'#4f8b47':'#6aa252'));if((r+c)%4===0)ball(x+1,y+1,9,1,1,1,'#db8d3f')}label(39,-36,14,'果树林');
box(98,32,28,22,13,'#e5c17d',true);viewer.entities.add({position:pos(98,32,17),ellipsoid:{radii:new Cesium.Cartesian3(16,12,5.2),material:C('#a96146')}});box(100,58,22,14,9,'#dcb375',true);box(96,47,31,4,1,'#c59762');label(98,32,24,'农场小屋');
cyl(72,34,18,5.5,'#5b99bd');for(const dx of [-4,4])for(const dy of [-4,4])cyl(72+dx,34+dy,7,.45,'#655d54');label(72,34,27,'灌溉水塔');
cyl(-116,57,26,1.1,'#e9ecef');ball(-116,57,29,2.1,2.1,2.1,'#f8f8f8');box(-116,57,2,26,.6,'#f4f4f4');box(-116,57,26,2,.6,'#f4f4f4');label(-116,57,36,'风能气象站');
for(let x=-118;x<=118;x+=15){tree(x,82,.82,(x/15)%2===0?'#4c8c48':'#5c9a52');tree(x,-78,.76,'#568f4d')}for(let y=-65;y<=68;y+=15){tree(-125,y,.78,'#4f8d49');if(y>0)tree(124,y,.72,'#609d54')}
fenceLine(-130,-84,130,-84,22);fenceLine(-130,86,130,86,22);fenceLine(-132,-76,-132,78,14);fenceLine(132,-76,132,78,14);
[[-6,56,'土壤传感器'],[7,-55,'环境传感器'],[56,62,'光照传感器']].forEach(s=>{cyl(s[0],s[1],7.5,.5,'#455a64');ball(s[0],s[1],8.2,1.2,1.2,1.2,'#78c7d4');label(s[0],s[1],12,s[2])});
const views={overview:[-235,-235,285,36,-29],fields:[-155,-125,150,30,-24],greenhouse:[-52,-20,115,40,-23],pond:[25,-140,120,12,-22],orchard:[-15,-112,110,18,-22]};
function goView(name){const v=views[name]||views.overview;viewer.camera.flyTo({destination:pos(v[0],v[1],v[2]),orientation:{heading:Cesium.Math.toRadians(v[3]),pitch:Cesium.Math.toRadians(v[4]),roll:0},duration:.9})}window.goView=goView;window.resetView=()=>goView('overview');goView('overview');
let t=23.6,m=42,l=680,w=2.1;setInterval(()=>{t+=(Math.random()-.5)*.2;m+=(Math.random()-.5)*.5;l+=(Math.random()-.5)*8;w=Math.max(0,w+(Math.random()-.5)*.15);document.getElementById('status').innerHTML=`<b>智慧农场 · 实时模拟</b><br>🌡️ ${t.toFixed(1)} °C　💧 ${m.toFixed(0)} %<br>☀️ ${l.toFixed(0)} lx　🌬️ ${w.toFixed(1)} m/s<br>🚿 自动灌溉：${m<35?'运行':'待机'}`},2500)
}catch(err){console.error(err);document.getElementById('farm').innerHTML='<div style="padding:32px;color:#17352e;font:16px sans-serif">三维场景初始化失败：'+err.message+'</div>'}
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开心农场 · 三维田园世界</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: Arial, "Microsoft YaHei", sans-serif; background: #bfe0ef; }
    #farm { position: fixed; inset: 0; }
    canvas { display: block; }
    .glass { position: fixed; z-index: 10; color: #f7fff8; background: rgba(24, 55, 43, .80); border: 1px solid rgba(255,255,255,.22); box-shadow: 0 14px 40px rgba(10, 30, 22, .20); backdrop-filter: blur(9px); }
    .hero { left: 18px; top: 18px; width: min(430px, calc(100vw - 36px)); padding: 16px 18px; border-radius: 18px; }
    .hero h1 { margin: 0 0 8px; font-size: 23px; letter-spacing: .5px; }
    .hero p { margin: 0; color: #ddf4e4; font-size: 13px; line-height: 1.65; }
    .badge { display: inline-block; margin-bottom: 8px; padding: 4px 9px; border-radius: 99px; background: rgba(255,255,255,.12); font-size: 11px; letter-spacing: 1px; }
    .buttons { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 7px; }
    button { border: 0; border-radius: 9px; padding: 8px 11px; background: #f8fff8; color: #214735; cursor: pointer; font-weight: 600; }
    button:hover { background: #e3f5e7; }
    .guide { right: 18px; top: 18px; width: 230px; padding: 13px 15px; border-radius: 15px; font-size: 12px; line-height: 1.75; }
    .legend { left: 18px; bottom: 18px; padding: 10px 13px; border-radius: 13px; font-size: 12px; line-height: 1.65; }
    .tour { right: 18px; bottom: 18px; padding: 10px 12px; border-radius: 13px; max-width: 360px; }
    .tour strong { display: block; margin-bottom: 5px; font-size: 12px; }
    .tour button { padding: 7px 9px; font-size: 12px; }
    .credit { position: fixed; z-index: 10; right: 20px; bottom: 86px; color: rgba(255,255,255,.72); text-shadow: 0 1px 3px rgba(0,0,0,.35); font-size: 10px; }
    @media (max-width: 780px) {
      .hero { right: 14px; left: 14px; top: 14px; width: auto; }
      .hero h1 { font-size: 19px; }
      .guide, .legend { display: none; }
      .tour { left: 14px; right: 14px; bottom: 14px; max-width: none; }
      .credit { display: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="farm"></div>

  <section class="glass hero">
    <span class="badge">TERRAIN-FIRST · HAPPY FARM</span>
    <h1>🌻 开心农场 · 三维田园世界</h1>
    <p>这一版先“造世界”，再放设施：起伏地形决定空间，主路和田间路组织场景，水塘形成低洼景观核心，农田按台地分区，外围林带形成完整边界。</p>
    <div class="buttons">
      <button onclick="location.href='index.html'">⌂ 首页</button>
      <button onclick="location.href='gis.html?mode=3d'">校园三维</button>
      <button data-view="overview">全景</button>
    </div>
  </section>

  <aside class="glass guide">
    <b>第一阶段场景骨架</b><br>
    ⛰ 起伏地形 / 台地<br>
    🛣 主路 / 田间路<br>
    💧 水塘 / 湿地区<br>
    🌾 四类农田分区<br>
    🌲 外围林带 / 小丘<br>
    🖱 拖动旋转 · 滚轮缩放
  </aside>

  <div class="glass legend">🌾 农田　🟩 草坡　💧 水塘　🛣 道路　🌲 林带　🏡 温室农舍</div>

  <div class="glass tour">
    <strong>场景视角</strong>
    <button data-view="overview">斜鸟瞰</button>
    <button data-view="fields">农田</button>
    <button data-view="pond">水塘</button>
    <button data-view="forest">林带</button>
    <button data-view="greenhouse">温室</button>
  </div>
  <div class="credit">Three.js · 纯前端 · GitHub Pages</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const mount = document.getElementById('farm');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfdff0);
    scene.fog = new THREE.FogExp2(0xc8e3ef, 0.00135);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    mount.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(43, window.innerWidth / window.innerHeight, 0.5, 1800);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 45;
    controls.maxDistance = 650;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.target.set(0, 8, 0);

    const hemi = new THREE.HemisphereLight(0xeaf8ff, 0x6f7e50, 2.3);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff2cf, 3.2);
    sun.position.set(-160, 260, 120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -330;
    sun.shadow.camera.right = 330;
    sun.shadow.camera.top = 280;
    sun.shadow.camera.bottom = -280;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 700;
    sun.shadow.bias = -0.00015;
    scene.add(sun);

    const world = new THREE.Group();
    scene.add(world);

    function gaussian(x, z, cx, cz, sx, sz, amp) {
      const dx = (x - cx) / sx;
      const dz = (z - cz) / sz;
      return amp * Math.exp(-(dx * dx + dz * dz));
    }

    function terrainHeight(x, z) {
      let h = 1.3 * Math.sin(x * 0.025) + 1.0 * Math.cos(z * 0.031) + 0.7 * Math.sin((x + z) * 0.018);
      h += gaussian(x, z, -205, -135, 85, 75, 16);
      h += gaussian(x, z, 210, -130, 95, 80, 13);
      h += gaussian(x, z, -215, 145, 100, 80, 18);
      h += gaussian(x, z, 220, 150, 95, 75, 16);
      h += gaussian(x, z, 150, 25, 115, 90, 5);
      h -= gaussian(x, z, 128, 72, 72, 60, 9.5);
      h -= gaussian(x, z, -10, -25, 165, 130, 1.8);
      return h;
    }

    const terrainGeo = new THREE.PlaneGeometry(560, 440, 90, 72);
    terrainGeo.rotateX(-Math.PI / 2);
    const tp = terrainGeo.attributes.position;
    for (let i = 0; i < tp.count; i++) {
      const x = tp.getX(i);
      const z = tp.getZ(i);
      tp.setY(i, terrainHeight(x, z));
    }
    tp.needsUpdate = true;
    terrainGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({ color: 0x79a95d, roughness: 0.98, metalness: 0.0 })
    );
    terrain.receiveShadow = true;
    world.add(terrain);

    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(360, 385, 18, 64),
      new THREE.MeshStandardMaterial({ color: 0x52754c, roughness: 1 })
    );
    base.position.y = -13;
    base.scale.z = 0.76;
    base.receiveShadow = true;
    world.add(base);

    const mat = {
      road: new THREE.MeshStandardMaterial({ color: 0xc7ae83, roughness: 1 }),
      soil: new THREE.MeshStandardMaterial({ color: 0x765036, roughness: 1 }),
      water: new THREE.MeshPhysicalMaterial({ color: 0x4ca9c3, roughness: 0.25, metalness: 0.02, transparent: true, opacity: 0.88, clearcoat: 0.3 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x8a6547, roughness: 0.9 }),
      trunk: new THREE.MeshStandardMaterial({ color: 0x71533b, roughness: 1 }),
      leaf1: new THREE.MeshStandardMaterial({ color: 0x3f7d45, roughness: 1 }),
      leaf2: new THREE.MeshStandardMaterial({ color: 0x57944d, roughness: 1 }),
      leaf3: new THREE.MeshStandardMaterial({ color: 0x6a9f51, roughness: 1 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0xc9f1e7, transparent: true, opacity: 0.42, roughness: 0.25, transmission: 0.15, side: THREE.DoubleSide }),
      roof: new THREE.MeshStandardMaterial({ color: 0xa9513d, roughness: 0.8 }),
      wall: new THREE.MeshStandardMaterial({ color: 0xe7c78f, roughness: 0.95 })
    };

    function addBox(x, z, w, d, h, material, yOffset = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, terrainHeight(x, z) + h / 2 + yOffset, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      world.add(mesh);
      return mesh;
    }

    function addRoadSegment(x1, z1, x2, z2, width = 10, material = mat.road) {
      const dx = x2 - x1, dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      const x = (x1 + x2) / 2, z = (z1 + z2) / 2;
      const road = addBox(x, z, length, width, 0.72, material, 0.75);
      road.rotation.y = -Math.atan2(dz, dx);
      return road;
    }

    addRoadSegment(0, 210, 0, -188, 13);
    addRoadSegment(-222, 18, 222, 18, 11);
    addRoadSegment(-118, 18, -118, 155, 7);
    addRoadSegment(-42, 18, -42, 155, 7);
    addRoadSegment(55, 18, 55, 151, 7);
    addRoadSegment(0, -108, 205, -108, 8);
    addRoadSegment(104, -108, 148, -30, 7);
    addRoadSegment(-205, -80, -70, -108, 6);
    addBox(0, 183, 56, 34, 0.9, mat.road, 0.7);

    const fieldDefs = [
      { x: -165, z: 93, w: 82, d: 95, color: 0xd0ad48 },
      { x: -80, z: 92, w: 70, d: 95, color: 0x6f9f46 },
      { x: -170, z: -47, w: 90, d: 95, color: 0x91a843 },
      { x: -75, z: -48, w: 72, d: 94, color: 0x8daf58 }
    ];

    fieldDefs.forEach((f, fieldIndex) => {
      addBox(f.x, f.z, f.w, f.d, 1.6, mat.soil, 1.0);
      const cropMat = new THREE.MeshStandardMaterial({ color: f.color, roughness: 1 });
      const rows = 10;
      for (let r = 0; r < rows; r++) {
        const rz = f.z - f.d / 2 + 8 + r * ((f.d - 16) / (rows - 1));
        const row = addBox(f.x, rz, f.w - 9, 2.4, 1.1 + (fieldIndex % 2) * 0.3, cropMat, 2.1);
        row.castShadow = false;
      }
    });

    const pond = new THREE.Mesh(new THREE.CircleGeometry(44, 64), mat.water);
    pond.rotation.x = -Math.PI / 2;
    pond.scale.set(1.45, 0.95, 1);
    pond.position.set(132, -2.4, 70);
    pond.receiveShadow = true;
    world.add(pond);

    const wetlandMat = new THREE.MeshStandardMaterial({ color: 0x6f9d68, roughness: 1 });
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * Math.PI * 2;
      const rx = 66 + (i % 3) * 3;
      const rz = 42 + ((i + 1) % 3) * 2;
      const x = 132 + Math.cos(a) * rx;
      const z = 70 + Math.sin(a) * rz;
      const reed = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 5 + (i % 4), 5), wetlandMat);
      reed.position.set(x, terrainHeight(x, z) + 2.4, z);
      reed.castShadow = true;
      world.add(reed);
    }

    for (let i = 0; i < 10; i++) addBox(95 + i * 5.2, 70, 4.4, 11, 1.2, mat.wood, 2.1);
    addRoadSegment(78, 70, 96, 70, 5, mat.wood);

    function tree(x, z, s = 1, leafMaterial = mat.leaf1) {
      const y = terrainHeight(x, z);
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.7 * s, 1.0 * s, 6.2 * s, 7), mat.trunk);
      trunk.position.set(x, y + 3.1 * s, z);
      trunk.castShadow = true;
      const crown = new THREE.Mesh(new THREE.ConeGeometry(4.2 * s, 9.0 * s, 8), leafMaterial);
      crown.position.set(x, y + 9.1 * s, z);
      crown.castShadow = true;
      world.add(trunk, crown);
    }

    const rand = (n) => {
      const v = Math.sin(n * 91.733) * 43758.5453;
      return v - Math.floor(v);
    };

    let seed = 1;
    function treeLine(x1, z1, x2, z2, count, spread = 8) {
      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0.5 : i / (count - 1);
        const x = THREE.MathUtils.lerp(x1, x2, t) + (rand(seed++) - .5) * spread;
        const z = THREE.MathUtils.lerp(z1, z2, t) + (rand(seed++) - .5) * spread;
        const s = 0.75 + rand(seed++) * 0.65;
        const leaf = [mat.leaf1, mat.leaf2, mat.leaf3][Math.floor(rand(seed++) * 3)];
        tree(x, z, s, leaf);
      }
    }

    treeLine(-255, -185, 255, -185, 38, 16);
    treeLine(-255, 188, -70, 205, 18, 13);
    treeLine(70, 205, 255, 185, 18, 13);
    treeLine(-258, -175, -262, 180, 27, 15);
    treeLine(260, -176, 258, 182, 28, 15);
    treeLine(-225, -145, -160, -118, 12, 17);
    treeLine(185, -155, 230, -115, 12, 17);
    treeLine(-224, 144, -170, 155, 11, 15);

    function greenhouse(x, z, rot = 0) {
      const group = new THREE.Group();
      const floor = new THREE.Mesh(new THREE.BoxGeometry(26, 1, 52), new THREE.MeshStandardMaterial({ color: 0x9b7a52, roughness: 1 }));
      floor.position.y = 0.5;
      floor.receiveShadow = true;
      group.add(floor);
      const shell = new THREE.Mesh(new THREE.BoxGeometry(25, 9, 50), mat.glass);
      shell.position.y = 5.3;
      shell.castShadow = true;
      group.add(shell);
      const roof = new THREE.Mesh(new THREE.CylinderGeometry(12.5, 12.5, 50, 18, 1, false, 0, Math.PI), mat.glass);
      roof.rotation.z = Math.PI / 2;
      roof.rotation.y = Math.PI / 2;
      roof.position.y = 9.5;
      group.add(roof);
      group.position.set(x, terrainHeight(x, z) + 1.1, z);
      group.rotation.y = rot;
      world.add(group);
    }
    greenhouse(46, 82, 0);
    greenhouse(78, 82, 0);
    greenhouse(46, 22, 0);

    addBox(165, -78, 42, 30, 18, mat.wall, 1.0);
    const barnRoof = new THREE.Mesh(new THREE.ConeGeometry(25, 12, 4), mat.roof);
    barnRoof.rotation.y = Math.PI / 4;
    barnRoof.scale.z = 0.78;
    barnRoof.position.set(165, terrainHeight(165, -78) + 25, -78);
    barnRoof.castShadow = true;
    world.add(barnRoof);

    const towerY = terrainHeight(210, -15);
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(7, 5, 17, 12), new THREE.MeshStandardMaterial({ color: 0x6b9db0, roughness: .75 }));
    tower.position.set(210, towerY + 24, -15);
    tower.castShadow = true;
    world.add(tower);
    for (const dx of [-5, 5]) for (const dz of [-5, 5]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.55, .75, 24, 6), mat.wood);
      leg.position.set(210 + dx, towerY + 12, -15 + dz);
      leg.castShadow = true;
      world.add(leg);
    }

    addBox(-14, 187, 3.2, 4, 17, mat.wall, 1.1);
    addBox(14, 187, 3.2, 4, 17, mat.wall, 1.1);
    addBox(0, 187, 31, 4, 3, mat.roof, 16.2);

    const views = {
      overview: { pos: new THREE.Vector3(330, 255, 340), target: new THREE.Vector3(0, 5, 5) },
      fields: { pos: new THREE.Vector3(-250, 150, 210), target: new THREE.Vector3(-110, 8, 20) },
      pond: { pos: new THREE.Vector3(280, 105, 185), target: new THREE.Vector3(130, -1, 70) },
      forest: { pos: new THREE.Vector3(-330, 125, -220), target: new THREE.Vector3(-200, 12, -130) },
      greenhouse: { pos: new THREE.Vector3(175, 95, 165), target: new THREE.Vector3(55, 7, 55) }
    };

    let flight = null;
    function goView(name) {
      const view = views[name] || views.overview;
      flight = {
        startTime: performance.now(),
        duration: 950,
        fromPos: camera.position.clone(),
        fromTarget: controls.target.clone(),
        toPos: view.pos.clone(),
        toTarget: view.target.clone()
      };
    }

    document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => goView(btn.dataset.view)));

    function ease(t) { return 1 - Math.pow(1 - t, 3); }
    function updateFlight(now) {
      if (!flight) return;
      const t = Math.min(1, (now - flight.startTime) / flight.duration);
      const e = ease(t);
      camera.position.lerpVectors(flight.fromPos, flight.toPos, e);
      controls.target.lerpVectors(flight.fromTarget, flight.toTarget, e);
      if (t >= 1) flight = null;
    }

    camera.position.copy(views.overview.pos);
    controls.target.copy(views.overview.target);
    controls.update();

    function animate(now) {
      requestAnimationFrame(animate);
      updateFlight(now);
      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

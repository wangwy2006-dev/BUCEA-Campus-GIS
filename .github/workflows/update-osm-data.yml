name: Update campus OSM snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-osm-data.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch campus OSM data
        run: |
          python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          WAY_ID = 546474045
          UA = {'User-Agent': 'BUCEA-Campus-GIS educational snapshot/1.3'}
          out = Path('data')
          out.mkdir(exist_ok=True)

          def get(url, timeout=90):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def point_in_ring(point, ring):
              x, y = point
              inside = False
              j = len(ring) - 1
              for i in range(len(ring)):
                  xi, yi = ring[i]; xj, yj = ring[j]
                  if ((yi > y) != (yj > y)) and (x < (xj-xi)*(y-yi)/(yj-yi) + xi):
                      inside = not inside
                  j = i
              return inside

          def centroid(coords):
              pts = coords[:-1] if len(coords) > 1 and coords[0] == coords[-1] else coords
              return [sum(p[0] for p in pts)/len(pts), sum(p[1] for p in pts)/len(pts)]

          def write_fc(filename, name, features):
              fc = {
                  'type':'FeatureCollection','name':name,
                  'source':'OpenStreetMap official Map API',
                  'license':'ODbL 1.0','campus_osm_way_id':WAY_ID,
                  'features':features
              }
              (out/filename).write_text(
                  json.dumps(fc, ensure_ascii=False, separators=(',',':')),
                  encoding='utf-8'
              )
              print(f'{filename}: features={len(features)}')

          # 1) Read the exact campus boundary from OSM Way 546474045.
          boundary_xml = get(f'https://api.openstreetmap.org/api/0.6/way/{WAY_ID}/full')
          root = ET.fromstring(boundary_xml)
          nodes = {int(n.attrib['id']): [float(n.attrib['lon']), float(n.attrib['lat'])] for n in root.findall('node')}
          way = next(w for w in root.findall('way') if int(w.attrib['id']) == WAY_ID)
          ring = [nodes[int(nd.attrib['ref'])] for nd in way.findall('nd')]
          if ring and ring[0] != ring[-1]: ring.append(ring[0])
          tags = {t.attrib['k']: t.attrib['v'] for t in way.findall('tag')}
          boundary = {
              'type':'FeatureCollection','name':'BUCEA_Daxing_Campus_Boundary_OSM',
              'source':'OpenStreetMap','license':'ODbL 1.0','osm_way_id':WAY_ID,
              'features':[{'type':'Feature','properties':{'osm_id':WAY_ID, **tags},
                           'geometry':{'type':'Polygon','coordinates':[ring]}}]
          }
          (out/'osm-campus-boundary.geojson').write_text(
              json.dumps(boundary, ensure_ascii=False, separators=(',',':')),
              encoding='utf-8'
          )

          # 2) The campus is a very small extent, so use the official OSM Map API
          # directly instead of depending on public Overpass instances.
          lons=[p[0] for p in ring]; lats=[p[1] for p in ring]
          west,south,east,north=min(lons),min(lats),max(lons),max(lats)
          pad=.00035
          bbox=f'{west-pad},{south-pad},{east+pad},{north+pad}'
          map_xml = get('https://api.openstreetmap.org/api/0.6/map?bbox=' + bbox)
          map_root = ET.fromstring(map_xml)
          map_nodes = {int(n.attrib['id']): [float(n.attrib['lon']), float(n.attrib['lat'])] for n in map_root.findall('node')}

          buildings, roads, areas = [], [], []
          for w in map_root.findall('way'):
              way_id = int(w.attrib['id'])
              props = {t.attrib['k']: t.attrib['v'] for t in w.findall('tag')}
              if not props: continue
              coords = [map_nodes[int(nd.attrib['ref'])] for nd in w.findall('nd') if int(nd.attrib['ref']) in map_nodes]
              if len(coords) < 2: continue
              properties = {'osm_id':way_id, **props}
              closed = len(coords) >= 4 and coords[0] == coords[-1]

              if props.get('building') and closed and point_in_ring(centroid(coords), ring):
                  buildings.append({'type':'Feature','properties':properties,
                                    'geometry':{'type':'Polygon','coordinates':[coords]}})

              if props.get('highway') and any(point_in_ring(p, ring) for p in coords):
                  roads.append({'type':'Feature','properties':properties,
                                'geometry':{'type':'LineString','coordinates':coords}})

              leisure = props.get('leisure')
              is_area = props.get('landuse') or leisure in {'pitch','track','garden','park','sports_centre'}
              if is_area and closed and point_in_ring(centroid(coords), ring):
                  areas.append({'type':'Feature','properties':properties,
                                'geometry':{'type':'Polygon','coordinates':[coords]}})

          write_fc('osm-buildings.geojson','BUCEA_OSM_Buildings',buildings)
          write_fc('osm-roads.geojson','BUCEA_OSM_Roads',roads)
          write_fc('osm-areas.geojson','BUCEA_OSM_Areas',areas)
          PY
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('osm-campus-boundary.geojson','osm-buildings.geojson','osm-roads.geojson','osm-areas.geojson'):
              p=Path('data')/name
              data=json.loads(p.read_text(encoding='utf-8'))
              assert data.get('type')=='FeatureCollection', name
              print(name, len(data.get('features',[])))
          PY
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm-*.geojson
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: cache campus OSM snapshot"
            git push
          fi

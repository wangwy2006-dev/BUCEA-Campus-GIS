<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北建大校园 GIS</title><script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css"><style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei"}.bar{position:absolute;z-index:20;top:12px;left:12px;padding:10px;background:#142033e8;border-radius:10px;color:white}.bar button{padding:9px 13px;margin:3px;border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:white;cursor:pointer}.info{position:absolute;z-index:20;bottom:12px;left:12px;padding:10px 14px;background:#142033e8;color:white;border-radius:8px;max-width:760px}.farmPanel{display:none;position:absolute;z-index:30;inset:0;background:linear-gradient(#83c9f4 0 38%,#a9d879 38% 100%);overflow:hidden}.farmTop{position:absolute;z-index:5;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;color:white}.farmTitle{font-size:26px;font-weight:700;text-shadow:0 2px 5px #234}.back{padding:9px 14px;border:0;border-radius:8px;background:#17324dcc;color:white}.sun{position:absolute;right:10%;top:10%;width:85px;height:85px;border-radius:50%;background:#ffd34d;box-shadow:0 0 40px #fff27a;animation:pulse 2s infinite alternate}.cloud{position:absolute;top:16%;left:-180px;font-size:80px;animation:cloud 18s linear infinite}.field{position:absolute;left:8%;right:8%;bottom:8%;height:45%;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;perspective:700px}.bed{background:repeating-linear-gradient(90deg,#6e3d1e 0 12px,#5a321b 12px 22px);border:5px solid #d4a35d;border-radius:10px;transform:rotateX(35deg);box-shadow:0 10px 20px #0003;display:flex;align-items:center;justify-content:center;font-size:42px}.greenhouse{position:absolute;right:10%;bottom:48%;width:170px;height:90px;border:5px solid #eef;background:#d9ffff88;border-radius:80px 80px 8px 8px;text-align:center;padding-top:35px;color:#164c45;font-weight:bold}.sensor{position:absolute;padding:8px 12px;background:#123c35dd;color:#fff;border-radius:8px;font-size:13px}.s1{left:12%;bottom:48%}.s2{left:36%;bottom:48%}.s3{left:58%;bottom:48%}@keyframes cloud{to{left:110%}}@keyframes pulse{to{transform:scale(1.08)}}</style></head><body><div id="map"></div><div class="bar"><b>北京建筑大学 · 大兴校区 GIS</b><br><button onclick="show2D()">🗺️ 二维校园</button><button onclick="show3D()">🏢 三维校园</button><button onclick="showFarm()">🌱 开心农场</button><button onclick="location.href='index.html'">⌂ 学校首页</button></div><div class="info" id="info">正在进入北京建筑大学大兴校区……</div><div class="farmPanel" id="farmPanel"><div class="farmTop"><div class="farmTitle">🌻 开心农场 · 虚拟智慧农业实验场</div><button class="back" onclick="closeFarm()">返回校园 GIS</button></div><div class="sun"></div><div class="cloud">☁️</div><div class="greenhouse">🏡 智慧温室</div><div class="sensor s1">🌡️ 23.6°C<br>空气湿度 58%</div><div class="sensor s2">💧 土壤湿度 42%<br>自动灌溉：待机</div><div class="sensor s3">☀️ 光照 680 lx<br>风速 2.1 m/s</div><div class="field"><div class="bed">🌻🌻🌻</div><div class="bed">🥬🥬🥬</div><div class="bed">🌽🌽🌽</div><div class="bed">🍅🍅🍅</div></div></div><script>
const CAMPUS={lon:116.28018,lat:39.74715};
const FALLBACK_VIEW=Cesium.Rectangle.fromDegrees(116.2735,39.7418,116.2872,39.7524);
const OSM_CAMPUS_WAY='W546474045';
const OSM_BOUNDARY_URL='https://nominatim.openstreetmap.org/lookup?osm_ids='+OSM_CAMPUS_WAY+'&format=geojson&polygon_geojson=1';
const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false});
viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));viewer.scene.globe.depthTestAgainstTerrain=false;
let realBoundary,bds,blg;
function info(t){document.getElementById('info').innerHTML=t}
function height(e){try{return Number(e.properties.height.getValue())||20}catch(x){return 20}}
async function loadRealBoundary(){if(realBoundary)return realBoundary;info('<b>二维校园 GIS</b>｜正在读取 OpenStreetMap 中北京建筑大学大兴校区真实边界（Way 546474045）……');try{const r=await fetch(OSM_BOUNDARY_URL,{headers:{'Accept':'application/geo+json,application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const geojson=await r.json();if(!geojson.features||!geojson.features.length)throw new Error('未返回校园边界');realBoundary=await Cesium.GeoJsonDataSource.load(geojson,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#00d8ff'),strokeWidth:4,fill:Cesium.Color.fromCssColorString('#00d8ff').withAlpha(.10)});viewer.dataSources.add(realBoundary);return realBoundary}catch(err){console.warn('OSM campus boundary unavailable:',err);return null}}
/* 早期手绘边界和8个矩形建筑仅保留为历史测试数据，不再用于二维正式展示。 */
function loadSchematic3D(){if(blg)return Promise.resolve();return Promise.all([Cesium.GeoJsonDataSource.load('data/campus-boundary.geojson',{clampToGround:true,stroke:Cesium.Color.CYAN,strokeWidth:3,fill:Cesium.Color.CYAN.withAlpha(.06)}),Cesium.GeoJsonDataSource.load('data/campus-buildings.geojson',{clampToGround:false})]).then(([a,b])=>{bds=a;blg=b;viewer.dataSources.add(a);viewer.dataSources.add(b)})}
function paint3D(){if(!blg)return;blg.entities.values.forEach((e,i)=>{if(!e.polygon)return;e.polygon.height=0;e.polygon.extrudedHeight=height(e);e.polygon.material=[Cesium.Color.ROYALBLUE,Cesium.Color.CORNFLOWERBLUE,Cesium.Color.STEELBLUE][i%3].withAlpha(.9);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.WHITE})}
function hideLegacy(){if(bds)bds.show=false;if(blg)blg.show=false}
async function show2D(){document.getElementById('farmPanel').style.display='none';hideLegacy();viewer.scene.morphTo2D(0);const boundary=await loadRealBoundary();if(boundary){boundary.show=true;await viewer.flyTo(boundary,{duration:.8});info('<b>二维校园 GIS · 真实边界已接入</b>｜青色范围来自 OpenStreetMap 的北京建筑大学大兴校区 Way 546474045，镜头按真实边界自动聚焦。底图与边界均为 © OpenStreetMap contributors。下一步将在这个边界内提取真实建筑、道路和体育/绿地要素。')}else{viewer.camera.setView({destination:FALLBACK_VIEW});info('<b>二维校园 GIS</b>｜OpenStreetMap 边界服务本次未能返回数据，已使用校区附近备用视图；未回退显示早期错误矩形。')}}
function show3D(){document.getElementById('farmPanel').style.display='none';if(realBoundary)realBoundary.show=false;viewer.scene.morphTo3D(0);loadSchematic3D().then(()=>{if(bds)bds.show=true;if(blg)blg.show=true;paint3D();viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(CAMPUS.lon,CAMPUS.lat,1150),orientation:{heading:Cesium.Math.toRadians(20),pitch:Cesium.Math.toRadians(-45),roll:0}});info('<b>三维校园</b>｜当前仍是历史示意建筑，仅用于保留三维入口。真实三维将在二维真实 footprint 接入后由同一套数据直接拉伸生成。')})}
function showFarm(){document.getElementById('farmPanel').style.display='block';info('开心农场虚拟场景')}
function closeFarm(){document.getElementById('farmPanel').style.display='none';show2D()}
show2D();
</script></body></html>

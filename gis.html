<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北建大校园 GIS</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
<style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei"}.bar{position:absolute;z-index:20;top:12px;left:12px;padding:10px;background:#142033e8;border-radius:10px;color:white;box-shadow:0 6px 24px #0003}.bar button{padding:9px 13px;margin:3px;border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:white;cursor:pointer}.bar button:hover{background:#ffffff2e}.info{position:absolute;z-index:20;bottom:12px;left:12px;padding:10px 14px;background:#142033e8;color:white;border-radius:8px;max-width:920px;line-height:1.55}.tip{position:absolute;z-index:20;right:12px;top:12px;padding:9px 12px;border-radius:8px;background:#ffffffdc;color:#24364b;font-size:12px;box-shadow:0 4px 18px #0002}</style></head>
<body><div id="map"></div><div class="bar"><b>北京建筑大学 · 大兴校区 GIS</b><br><button onclick="show2D()">🗺️ 二维校园</button><button onclick="show3D()">🏢 三维校园</button><button onclick="location.href='farm3d.html'">🌱 开心农场</button><button onclick="location.href='index.html'">⌂ 学校首页</button></div><div class="tip">三维模式可拖动旋转 · 滚轮缩放 · 点击建筑查看信息</div><div class="info" id="info">正在读取项目内校园空间数据……</div>
<script>
const FALLBACK_VIEW=Cesium.Rectangle.fromDegrees(116.2754,39.7426,116.2850,39.7518);
const LOCAL={boundary:'data/osm-campus-boundary.geojson',buildings:'data/osm-buildings.geojson',roads:'data/osm-roads.geojson',areas:'data/osm-areas.geojson'};
const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,selectionIndicator:true,infoBox:false});
viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));viewer.scene.globe.depthTestAgainstTerrain=false;viewer.scene.globe.enableLighting=true;viewer.scene.fog.enabled=true;viewer.scene.fog.density=.0002;viewer.scene.skyAtmosphere.show=true;
let boundaryDS=null,buildingDS=null,roadDS=null,areaDS=null,bounds=null,currentMode='2d';
const counts={buildings:0,roads:0,areas:0};
const palette={dorm:'#d7b48b',teaching:'#c78663',research:'#9c7459',library:'#b05243',sport:'#9fb4c5',service:'#d9b45d',generic:'#b2a48f'};
function info(t){document.getElementById('info').innerHTML=t}
function prop(entity,name){try{const p=entity.properties&&entity.properties[name];return p&&p.getValue?String(p.getValue()):''}catch(e){return''}}
function buildingClass(e){const name=(prop(e,'name')||prop(e,'name:zh')).toLowerCase(),type=prop(e,'building'),amenity=prop(e,'amenity');if(type==='dormitory'||/\d+号楼|宿舍/.test(name))return'dorm';if(type==='stadium'||/体育馆|气膜/.test(name))return'sport';if(amenity==='library'||/图书馆/.test(name))return'library';if(amenity==='restaurant'||/园$|食堂|餐厅|活动中心|医务/.test(name))return'service';if(/教学楼|学院|实验|工程实践|行政楼/.test(name))return name.includes('教学楼')?'teaching':'research';return'generic'}
function defaultHeight(e){const cls=buildingClass(e),name=prop(e,'name')||'';if(cls==='dorm')return 21;if(cls==='teaching')return 20;if(cls==='library')return 24;if(cls==='sport')return name.includes('气膜')?15:22;if(cls==='service')return 14;if(cls==='research')return name.includes('行政楼')?20:18;return 15}
function buildingHeight(e){const h=parseFloat(prop(e,'height'));if(Number.isFinite(h)&&h>0)return h;const lv=parseFloat(prop(e,'building:levels'));if(Number.isFinite(lv)&&lv>0)return lv*3.3;return defaultHeight(e)}
function buildingColor(e){return Cesium.Color.fromCssColorString(palette[buildingClass(e)]||palette.generic)}
function collectCoords(g,out){if(!g)return;if(typeof g[0]==='number'){out.push(g);return}g.forEach(x=>collectCoords(x,out))}
function geojsonBounds(geo){const pts=[];(geo.features||[]).forEach(f=>collectCoords(f.geometry&&f.geometry.coordinates,pts));if(!pts.length)return null;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return {w:Math.min(...xs),s:Math.min(...ys),e:Math.max(...xs),n:Math.max(...ys)}}
async function fetchGeo(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status+' '+url);return r.json()}
async function loadBoundary(){if(boundaryDS)return boundaryDS;try{const geo=await fetchGeo(LOCAL.boundary);bounds=geojsonBounds(geo);boundaryDS=await Cesium.GeoJsonDataSource.load(geo,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#20b7c9'),strokeWidth:4,fill:Cesium.Color.fromCssColorString('#4fd5cf').withAlpha(.035)});viewer.dataSources.add(boundaryDS);return boundaryDS}catch(e){console.warn('Local campus boundary unavailable',e);return null}}
async function loadLocalLayer(url,options,countKey){try{const geo=await fetchGeo(url);counts[countKey]=(geo.features||[]).length;const ds=await Cesium.GeoJsonDataSource.load(geo,options);viewer.dataSources.add(ds);return ds}catch(e){console.warn('Local layer unavailable:',url,e);return null}}
function addBuildingLabels(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon||e.label)return;const name=prop(e,'name')||prop(e,'name:zh');if(!name)return;try{const hierarchy=e.polygon.hierarchy.getValue(Cesium.JulianDate.now());if(!hierarchy||!hierarchy.positions||!hierarchy.positions.length)return;const center=Cesium.BoundingSphere.fromPoints(hierarchy.positions).center;e.position=center;e.label=new Cesium.LabelGraphics({text:name.replace('北京建筑大学大兴校区',''),font:'13px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#26384c').withAlpha(.8),pixelOffset:new Cesium.Cartesian2(0,-9),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1750),disableDepthTestDistance:1000})}catch(err){console.warn('label skipped',name,err)}})}
async function loadBuildings(){if(buildingDS)return buildingDS;await loadBoundary();buildingDS=await loadLocalLayer(LOCAL.buildings,{clampToGround:false},'buildings');if(buildingDS)addBuildingLabels();return buildingDS}
async function loadContextLayers(){if(!roadDS)roadDS=await loadLocalLayer(LOCAL.roads,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#f2d28f'),strokeWidth:3},'roads');if(!areaDS){areaDS=await loadLocalLayer(LOCAL.areas,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#477f49'),strokeWidth:1.5,fill:Cesium.Color.fromCssColorString('#79ad64').withAlpha(.3)},'areas');styleAreas()}return {roads:!!roadDS,areas:!!areaDS}}
function styleAreas(){if(!areaDS)return;areaDS.entities.values.forEach(e=>{if(!e.polygon)return;const leisure=prop(e,'leisure'),sport=prop(e,'sport'),landuse=prop(e,'landuse');if(leisure==='pitch'){e.polygon.material=Cesium.Color.fromCssColorString(sport==='soccer'?'#68a95b':'#769d70').withAlpha(.55);e.polygon.outlineColor=Cesium.Color.WHITE.withAlpha(.65)}else if(leisure==='garden'||landuse==='grass'){e.polygon.material=Cesium.Color.fromCssColorString('#78ae63').withAlpha(.34)}else if(landuse==='recreation_ground'){e.polygon.material=Cesium.Color.fromCssColorString('#80a96f').withAlpha(.4)}else{e.polygon.material=Cesium.Color.fromCssColorString('#b7b18d').withAlpha(.25)}})}
function paint2D(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;e.polygon.height=0;e.polygon.extrudedHeight=0;e.polygon.material=buildingColor(e).withAlpha(.82);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString('#725640');if(e.label)e.label.show=true})}
function paint3D(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;const h=buildingHeight(e),cls=buildingClass(e);e.polygon.height=0;e.polygon.extrudedHeight=h;e.polygon.material=buildingColor(e).withAlpha(.96);e.polygon.outline=true;e.polygon.outlineColor=cls==='library'?Cesium.Color.fromCssColorString('#7c352d'):Cesium.Color.WHITE.withAlpha(.5);e.polygon.shadows=Cesium.ShadowMode.ENABLED;if(e.label)e.label.show=true})}
async function focusCampus(){if(boundaryDS){await viewer.flyTo(boundaryDS,{duration:.55});return}viewer.camera.setView({destination:FALLBACK_VIEW})}
function statusText(ctx){return `本地 OSM 快照：建筑 <b>${counts.buildings}</b>、道路 <b>${counts.roads}</b>、体育/绿地等地块 <b>${counts.areas}</b>；${ctx.roads?'道路已加载':'道路文件异常'}，${ctx.areas?'地块已加载':'地块文件异常'}。`}
async function show2D(){currentMode='2d';viewer.scene.morphTo2D(0);await loadBoundary();const [buildings,ctx]=await Promise.all([loadBuildings(),loadContextLayers()]);if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint2D()}await focusCampus();info(`<b>二维校园 GIS</b>｜建筑按宿舍、教学科研、图书馆、体育和服务设施分类着色；校园边界与专题数据全部读取仓库本地 GeoJSON。${statusText(ctx)}`)}
async function show3D(){currentMode='3d';viewer.scene.morphTo3D(0);await loadBoundary();const [buildings,ctx]=await Promise.all([loadBuildings(),loadContextLayers()]);if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint3D();viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(116.2749,39.7411,920),orientation:{heading:Cesium.Math.toRadians(38),pitch:Cesium.Math.toRadians(-31),roll:0},duration:.8});info(`<b>三维校园 GIS</b>｜真实 footprint 按建筑功能形成视觉层级：宿舍暖米色、教学科研砖色、图书馆深红、体育馆冷灰蓝、生活服务金黄。高度优先使用 OSM height / building:levels，缺失时按建筑用途采用可解释教学默认值。${statusText(ctx)}`)}else{await focusCampus();info('<b>三维校园 GIS</b>｜校园边界已加载，但本地建筑文件异常，请检查 data/osm-buildings.geojson。')}}
viewer.screenSpaceEventHandler.setInputAction(function(click){const picked=viewer.scene.pick(click.position);if(!Cesium.defined(picked)||!picked.id||!picked.id.polygon)return;const e=picked.id,name=prop(e,'name')||prop(e,'name:zh')||'未命名建筑',cls=buildingClass(e),height=Math.round(buildingHeight(e));const clsText={dorm:'学生宿舍',teaching:'教学建筑',research:'科研/行政建筑',library:'图书馆',sport:'体育建筑',service:'生活服务设施',generic:'校园建筑'}[cls];info(`<b>${name}</b>｜${clsText}｜当前三维表达高度约 <b>${height} m</b>${prop(e,'building:levels')?'｜OSM 层数：'+prop(e,'building:levels'):''}<br><span style="opacity:.8">数据来源：OpenStreetMap 本地快照；未记录真实高度的建筑采用按用途定义的教学默认值，不代表测绘实测高度。</span>`);viewer.selectedEntity=e},Cesium.ScreenSpaceEventType.LEFT_CLICK);
const mode=new URLSearchParams(location.search).get('mode');if(mode==='3d')show3D();else show2D();
</script></body></html>

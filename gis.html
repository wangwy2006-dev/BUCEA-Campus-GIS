<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>北建大校园 GIS</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
<style>
html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei",sans-serif;background:#cfe5f5}.bar{position:absolute;z-index:20;top:12px;left:12px;padding:11px 12px;background:#142033e8;border-radius:11px;color:white;box-shadow:0 6px 24px #0003}.bar b{font-size:15px}.bar button{padding:9px 12px;margin:5px 3px 0;border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:white;cursor:pointer}.bar button:hover{background:#ffffff30}.info{position:absolute;z-index:20;bottom:12px;left:12px;padding:10px 14px;background:#142033e8;color:white;border-radius:9px;max-width:920px;line-height:1.55;font-size:13px;box-shadow:0 5px 20px #0003}.tip{position:absolute;z-index:20;right:12px;top:12px;padding:9px 12px;border-radius:8px;background:#ffffffdf;color:#24364b;font-size:12px;box-shadow:0 4px 18px #0002}.badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:12px;background:#2aa4a8;color:white;font-size:11px}.legend{position:absolute;z-index:20;right:12px;bottom:12px;width:180px;padding:10px 12px;border-radius:9px;background:#fffffff0;color:#24364b;font-size:11px;line-height:1.65;box-shadow:0 4px 18px #0002}.legend b{font-size:12px}.sw{display:inline-block;width:16px;height:7px;border-radius:3px;margin-right:6px;vertical-align:middle}.muted{opacity:.75}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar"><b>北京建筑大学 · 大兴校区 GIS</b><span class="badge">本地 OSM 数据</span><br><button onclick="show2D()">🗺️ 二维校园</button><button onclick="show3D()">🏢 三维校园</button><button onclick="focusCampus3D()">🎯 校园全景</button><button onclick="location.href='farm3d.html'">🌱 开心农场</button><button onclick="location.href='index.html'">⌂ 首页</button></div>
<div class="tip">三维：左键旋转 · 滚轮缩放 · 点击建筑查看信息</div>
<div class="legend"><b>校园空间图例</b><br><span class="sw" style="background:#c78663"></span>教学 / 科研建筑<br><span class="sw" style="background:#d7b48b"></span>宿舍 / 生活建筑<br><span class="sw" style="background:#5b9360"></span>绿地 / 花园<br><span class="sw" style="background:#66a85a"></span>运动场地<br><span class="sw" style="background:#d8b878"></span>校园道路<br><span class="sw" style="background:#eadfbd"></span>步行路径<br><span class="muted">二维 / 三维共用同一套 footprint</span></div>
<div class="info" id="info">正在读取项目内校园空间数据……</div>
<script>
const FALLBACK_VIEW=Cesium.Rectangle.fromDegrees(116.2754,39.7426,116.2850,39.7518);
const LOCAL={boundary:'data/osm-campus-boundary.geojson',buildings:'data/osm-buildings.geojson',roads:'data/osm-roads.geojson',areas:'data/osm-areas.geojson'};
const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,fullscreenButton:false,selectionIndicator:true,infoBox:false});
viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));
viewer.scene.globe.depthTestAgainstTerrain=false;viewer.scene.globe.enableLighting=false;viewer.scene.fog.enabled=true;viewer.scene.fog.density=.00013;viewer.scene.skyAtmosphere.show=true;viewer.scene.shadowMap.enabled=true;viewer.clock.shouldAnimate=false;viewer.clock.currentTime=Cesium.JulianDate.fromIso8601('2026-09-08T03:30:00Z');
let boundaryDS=null,buildingDS=null,roadDS=null,areaDS=null,bounds=null,currentMode='2d',landmarksBuilt=false,campusSceneBuilt=false;
const counts={buildings:0,roads:0,areas:0,namedAreas:0};
const palette={dorm:'#d7b48b',teaching:'#c78663',research:'#9c7459',library:'#b05243',sport:'#9fb4c5',service:'#d9b45d',generic:'#b2a48f'};
function info(t){document.getElementById('info').innerHTML=t}
function prop(e,n){try{const p=e.properties&&e.properties[n];return p&&p.getValue?String(p.getValue()):''}catch(err){return''}}
function buildingClass(e){const name=(prop(e,'name')||prop(e,'name:zh')).toLowerCase(),type=prop(e,'building'),amenity=prop(e,'amenity');if(type==='dormitory'||/\d+号楼|宿舍/.test(name))return'dorm';if(type==='stadium'||/体育馆|气膜/.test(name))return'sport';if(amenity==='library'||/图书馆/.test(name))return'library';if(amenity==='restaurant'||/园$|食堂|餐厅|活动中心|医务/.test(name))return'service';if(/教学楼|学院|实验|工程实践|行政楼/.test(name))return name.includes('教学楼')?'teaching':'research';return'generic'}
function defaultHeight(e){const cls=buildingClass(e),name=prop(e,'name')||'';if(cls==='dorm')return 21;if(cls==='teaching')return 20;if(cls==='library')return 24;if(cls==='sport')return name.includes('气膜')?15:22;if(cls==='service')return 14;if(cls==='research')return name.includes('行政楼')?20:18;return 15}
function buildingHeight(e){const h=parseFloat(prop(e,'height'));if(Number.isFinite(h)&&h>0)return h;const lv=parseFloat(prop(e,'building:levels'));if(Number.isFinite(lv)&&lv>0)return lv*3.3;return defaultHeight(e)}
function buildingColor(e){return Cesium.Color.fromCssColorString(palette[buildingClass(e)]||palette.generic)}
function collectCoords(g,out){if(!g)return;if(typeof g[0]==='number'){out.push(g);return}g.forEach(x=>collectCoords(x,out))}
function geojsonBounds(geo){const pts=[];(geo.features||[]).forEach(f=>collectCoords(f.geometry&&f.geometry.coordinates,pts));if(!pts.length)return null;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return{w:Math.min(...xs),s:Math.min(...ys),e:Math.max(...xs),n:Math.max(...ys)}}
function paddedRect(b,p=.00028){return b?Cesium.Rectangle.fromDegrees(b.w-p,b.s-p,b.e+p,b.n+p):FALLBACK_VIEW}
function boundsCenter(b){return b?{lon:(b.w+b.e)/2,lat:(b.s+b.n)/2}:{lon:116.2802,lat:39.7471}}
async function fetchGeo(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status+' '+url);return r.json()}
async function loadBoundary(){if(boundaryDS)return boundaryDS;try{const geo=await fetchGeo(LOCAL.boundary);bounds=geojsonBounds(geo);boundaryDS=await Cesium.GeoJsonDataSource.load(geo,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#22b6c6'),strokeWidth:4,fill:Cesium.Color.fromCssColorString('#55d2ca').withAlpha(.025)});viewer.dataSources.add(boundaryDS);return boundaryDS}catch(e){console.warn(e);return null}}
async function loadLocalLayer(url,options,countKey){try{const geo=await fetchGeo(url);counts[countKey]=(geo.features||[]).length;const ds=await Cesium.GeoJsonDataSource.load(geo,options);viewer.dataSources.add(ds);return ds}catch(e){console.warn('Local layer unavailable',url,e);return null}}
function entityCenter(e){try{const h=e.polygon&&e.polygon.hierarchy.getValue(Cesium.JulianDate.now());if(!h||!h.positions||!h.positions.length)return null;return Cesium.BoundingSphere.fromPoints(h.positions).center}catch(err){return null}}
function entitySphere(e){try{const h=e.polygon&&e.polygon.hierarchy.getValue(Cesium.JulianDate.now());if(!h||!h.positions||!h.positions.length)return null;return Cesium.BoundingSphere.fromPoints(h.positions)}catch(err){return null}}
function addBuildingLabels(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon||e.label)return;const name=prop(e,'name')||prop(e,'name:zh');if(!name)return;const center=entityCenter(e);if(!center)return;e.position=center;e.label=new Cesium.LabelGraphics({text:name.replace('北京建筑大学大兴校区',''),font:'13px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#26384c').withAlpha(.8),pixelOffset:new Cesium.Cartesian2(0,-9),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1550),disableDepthTestDistance:1000})})}
async function loadBuildings(){if(buildingDS)return buildingDS;await loadBoundary();buildingDS=await loadLocalLayer(LOCAL.buildings,{clampToGround:false},'buildings');if(buildingDS)addBuildingLabels();return buildingDS}
function roadStyle(e){const h=prop(e,'highway');if(['primary','secondary','tertiary','unclassified','residential','service'].includes(h))return{width:h==='service'?3.2:4.5,color:'#d8b878'};if(['footway','path','pedestrian','steps'].includes(h))return{width:h==='pedestrian'?3:2,color:'#eadfbd'};if(h==='cycleway')return{width:2.4,color:'#b9d6c3'};return{width:2.2,color:'#d8c89d'}}
function styleRoads(){if(!roadDS)return;roadDS.entities.values.forEach(e=>{if(!e.polyline)return;const s=roadStyle(e);e.polyline.width=s.width;e.polyline.material=Cesium.Color.fromCssColorString(s.color).withAlpha(.92);e.polyline.clampToGround=true})}
function areaStyle(e){const leisure=prop(e,'leisure'),sport=prop(e,'sport'),landuse=prop(e,'landuse'),amenity=prop(e,'amenity');if(leisure==='pitch')return{fill:sport==='soccer'?'#66a85a':'#779a72',alpha:.58,outline:'#f3f5ee'};if(leisure==='track')return{fill:'#b77762',alpha:.48,outline:'#f1dccb'};if(leisure==='garden'||landuse==='grass'||landuse==='meadow')return{fill:'#6fa35f',alpha:.38,outline:'#dfead8'};if(landuse==='recreation_ground'||leisure==='park')return{fill:'#78a96a',alpha:.42,outline:'#e3eddf'};if(amenity==='parking')return{fill:'#b8b4aa',alpha:.32,outline:'#dedbd2'};return{fill:'#b7b18d',alpha:.24,outline:'#e6e1cf'}}
function styleAreas(){if(!areaDS)return;counts.namedAreas=0;areaDS.entities.values.forEach(e=>{if(!e.polygon)return;const s=areaStyle(e);e.polygon.material=Cesium.Color.fromCssColorString(s.fill).withAlpha(s.alpha);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString(s.outline).withAlpha(.72);const name=prop(e,'name')||prop(e,'name:zh');if(name){const center=entityCenter(e);if(center){counts.namedAreas++;e.position=center;e.label=new Cesium.LabelGraphics({text:name,font:'12px Microsoft YaHei',fillColor:Cesium.Color.fromCssColorString('#223829'),showBackground:true,backgroundColor:Cesium.Color.WHITE.withAlpha(.78),pixelOffset:new Cesium.Cartesian2(0,-4),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1350),disableDepthTestDistance:900})}}})}
async function loadContextLayers(){if(!roadDS){roadDS=await loadLocalLayer(LOCAL.roads,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#d8b878'),strokeWidth:3},'roads');styleRoads()}if(!areaDS){areaDS=await loadLocalLayer(LOCAL.areas,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#477f49'),strokeWidth:1.5,fill:Cesium.Color.fromCssColorString('#79ad64').withAlpha(.3)},'areas');styleAreas()}return{roads:!!roadDS,areas:!!areaDS}}
function landmarkSpec(name){if(/图书馆/.test(name))return{top:4,color:'#7d3b33',title:'图书馆 · 校园核心',kind:'library'};if(/综合体育馆/.test(name))return{top:5,color:'#6f8798',title:'综合体育馆',kind:'stadium'};if(/气膜体育馆/.test(name))return{top:3,color:'#dce8ee',title:'气膜体育馆',kind:'dome'};if(/行政楼/.test(name))return{top:3,color:'#72513f',title:'行政楼',kind:'admin'};if(/基础教学楼[ABCD]/.test(name))return{top:2,color:'#a86148',title:name,kind:'teaching'};return null}
function addAccent(center,sphere,spec){const r=Math.max(7,Math.min(22,sphere.radius*.55));if(spec.kind==='library')viewer.entities.add({name:'campus-landmark',position:center,box:{dimensions:new Cesium.Cartesian3(r*1.15,r*.75,5),material:Cesium.Color.fromCssColorString('#efe3d3'),outline:true,outlineColor:Cesium.Color.WHITE},properties:{sceneOverlay:true}});else if(spec.kind==='stadium'||spec.kind==='dome')viewer.entities.add({name:'campus-landmark',position:center,ellipsoid:{radii:new Cesium.Cartesian3(r*1.15,r*.82,spec.kind==='dome'?8:7),material:Cesium.Color.fromCssColorString(spec.kind==='dome'?'#eef7fb':'#c7d4dd').withAlpha(.94),outline:true,outlineColor:Cesium.Color.WHITE},properties:{sceneOverlay:true}});else if(spec.kind==='admin')viewer.entities.add({name:'campus-landmark',position:center,cylinder:{length:10,topRadius:.45,bottomRadius:.65,material:Cesium.Color.fromCssColorString('#dedbd3')},properties:{sceneOverlay:true}});else if(spec.kind==='teaching')viewer.entities.add({name:'campus-landmark',position:center,box:{dimensions:new Cesium.Cartesian3(r*1.05,r*.42,3.2),material:Cesium.Color.fromCssColorString('#d7aa8e'),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.8)},properties:{sceneOverlay:true}})}
function buildLandmarks(){if(landmarksBuilt||!buildingDS)return;const now=Cesium.JulianDate.now();buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;const name=prop(e,'name')||prop(e,'name:zh')||'',spec=landmarkSpec(name);if(!spec)return;try{const hierarchy=e.polygon.hierarchy.getValue(now),h=buildingHeight(e),sphere=entitySphere(e);if(!hierarchy||!sphere)return;viewer.entities.add({name:'campus-landmark',polygon:{hierarchy,perPositionHeight:false,height:h+.35,extrudedHeight:h+spec.top,material:Cesium.Color.fromCssColorString(spec.color).withAlpha(.98),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.72)},properties:{sceneOverlay:true}});const c=Cesium.Cartographic.fromCartesian(sphere.center),accent=Cesium.Cartesian3.fromRadians(c.longitude,c.latitude,h+spec.top+3);addAccent(accent,sphere,spec);viewer.entities.add({name:'campus-landmark',position:accent,point:{pixelSize:7,color:Cesium.Color.fromCssColorString('#f5d77c'),outlineColor:Cesium.Color.WHITE,outlineWidth:2,disableDepthTestDistance:1000,distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1100)},label:{text:spec.title,font:'bold 14px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#16283a').withAlpha(.9),pixelOffset:new Cesium.Cartesian2(0,-28),disableDepthTestDistance:1000,distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1100)},properties:{sceneOverlay:true}})}catch(err){console.warn('landmark skipped',name,err)}});landmarksBuilt=true}
function addTree(lon,lat,z=0){viewer.entities.add({name:'campus-scene',position:Cesium.Cartesian3.fromDegrees(lon,lat,z+2.8),cylinder:{length:5.6,topRadius:.45,bottomRadius:.65,material:Cesium.Color.fromCssColorString('#77553e')},properties:{sceneOverlay:true}});viewer.entities.add({name:'campus-scene',position:Cesium.Cartesian3.fromDegrees(lon,lat,z+8),ellipsoid:{radii:new Cesium.Cartesian3(4.2,4.2,5.6),material:Cesium.Color.fromCssColorString('#5a9850')},properties:{sceneOverlay:true}})}
function addGroundRect(w,s,e,n,color,alpha=.75,height=.2){viewer.entities.add({name:'campus-scene',rectangle:{coordinates:Cesium.Rectangle.fromDegrees(w,s,e,n),height,material:Cesium.Color.fromCssColorString(color).withAlpha(alpha),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.25)},properties:{sceneOverlay:true}})}
function buildCampusScene(){if(campusSceneBuilt)return;/* 教学表达：用轻量几何强化入口—主轴—中心空间，不宣称测绘精度 */
addGroundRect(116.27918,39.74316,116.28196,39.74342,'#d7c7a5',.88,.25);addGroundRect(116.28038,39.74322,116.28072,39.74518,'#d8c49a',.78,.28);addGroundRect(116.27978,39.74490,116.28128,39.74516,'#d9c9a9',.62,.26);
viewer.entities.add({name:'campus-scene',position:Cesium.Cartesian3.fromDegrees(116.28055,39.74327,5),box:{dimensions:new Cesium.Cartesian3(52,6,9),material:Cesium.Color.fromCssColorString('#b45343'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#f2e6d5')},label:{text:'北京建筑大学',font:'bold 16px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#7b2f28').withAlpha(.88),pixelOffset:new Cesium.Cartesian2(0,-30),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1200),disableDepthTestDistance:900},properties:{sceneOverlay:true}});
for(let y=39.74355;y<=39.74482;y+=.00019){addTree(116.28025,y);addTree(116.28085,y)}for(let x=116.27945;x<=116.28172;x+=.00024){addTree(x,39.74352)}
viewer.entities.add({name:'campus-scene',position:Cesium.Cartesian3.fromDegrees(116.28055,39.74478,1),ellipse:{semiMajorAxis:34,semiMinorAxis:23,material:Cesium.Color.fromCssColorString('#7cab6b').withAlpha(.56),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.38)},properties:{sceneOverlay:true}});
viewer.entities.add({name:'campus-scene',position:Cesium.Cartesian3.fromDegrees(116.28055,39.74478,4),cylinder:{length:7,topRadius:5,bottomRadius:5,material:Cesium.Color.fromCssColorString('#c9b075')},properties:{sceneOverlay:true}});
viewer.entities.add({name:'campus-scene',position:Cesium.Cartesian3.fromDegrees(116.28055,39.74478,8),ellipsoid:{radii:new Cesium.Cartesian3(3.2,3.2,3.2),material:Cesium.Color.fromCssColorString('#e5d191')},properties:{sceneOverlay:true}});campusSceneBuilt=true}
function setSceneVisibility(show){viewer.entities.values.forEach(e=>{try{if(e.properties&&e.properties.sceneOverlay&&e.properties.sceneOverlay.getValue())e.show=show}catch(err){}})}
function paint2D(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;e.polygon.height=0;e.polygon.extrudedHeight=0;e.polygon.material=buildingColor(e).withAlpha(.82);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString('#725640');if(e.label)e.label.show=true});setSceneVisibility(false)}
function paint3D(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;const h=buildingHeight(e),cls=buildingClass(e);e.polygon.height=0;e.polygon.extrudedHeight=h;e.polygon.material=buildingColor(e).withAlpha(.96);e.polygon.outline=true;e.polygon.outlineColor=cls==='library'?Cesium.Color.fromCssColorString('#7c352d'):Cesium.Color.WHITE.withAlpha(.48);e.polygon.shadows=Cesium.ShadowMode.ENABLED;if(e.label)e.label.show=true});buildLandmarks();buildCampusScene();setSceneVisibility(true)}
async function focusCampus(){viewer.camera.flyTo({destination:paddedRect(bounds),duration:.55})}
function focusCampus3D(){if(currentMode!=='3d'){show3D();return}const c=boundsCenter(bounds);viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(c.lon-.0034,c.lat-.0041,560),orientation:{heading:Cesium.Math.toRadians(28),pitch:Cesium.Math.toRadians(-31),roll:0},duration:.8})}
function statusText(ctx){return`本地 OSM 快照：建筑 <b>${counts.buildings}</b>、道路 <b>${counts.roads}</b>、体育/绿地等地块 <b>${counts.areas}</b>；${ctx.roads?'道路已按类型分级':'道路文件异常'}，${ctx.areas?`地块已分类（${counts.namedAreas} 个有名称）`:'地块文件异常'}。`}
async function show2D(){currentMode='2d';viewer.scene.morphTo2D(0);await loadBoundary();const [b,ctx]=await Promise.all([loadBuildings(),loadContextLayers()]);if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint2D()}await focusCampus();info(`<b>二维校园 GIS</b>｜真实边界、建筑 footprint、道路和主要地块均读取仓库本地 GeoJSON；道路按机动车/服务/步行分类表达，体育与绿地按用途分层。${statusText(ctx)}`)}
async function show3D(){currentMode='3d';viewer.scene.morphTo3D(0);await loadBoundary();const [b,ctx]=await Promise.all([loadBuildings(),loadContextLayers()]);if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint3D()}focusCampus3D();info(`<b>三维校园 GIS</b>｜二维/三维共用同一套真实 footprint；优先使用 OSM height / building:levels，缺失时使用教学默认高度。真实路网和地块保留为校园空间底座，入口、主轴、广场和林荫空间为低模教学表达。${statusText(ctx)}`)}
const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);handler.setInputAction(m=>{const picked=viewer.scene.pick(m.position);if(!Cesium.defined(picked)||!picked.id||!buildingDS||!buildingDS.entities.contains(picked.id))return;const e=picked.id,name=prop(e,'name')||prop(e,'name:zh')||'未命名建筑',cls=buildingClass(e),h=buildingHeight(e),source=(prop(e,'height')||prop(e,'building:levels'))?'OSM 高度/层数属性':'教学默认高度';info(`<b>${name}</b>｜类型：${cls}｜三维高度：约 ${h.toFixed(1)} m｜高度来源：${source}`)},Cesium.ScreenSpaceEventType.LEFT_CLICK);
(async()=>{const q=new URLSearchParams(location.search);if(q.get('mode')==='3d')await show3D();else await show2D()})().catch(e=>{console.error(e);info('校园 GIS 初始化失败：'+e.message)});
</script>
</body></html>

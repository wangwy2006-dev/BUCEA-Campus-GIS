html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei",sans-serif;background:#cfe5f5}.panel{position:absolute;z-index:20;top:12px;left:12px;max-width:720px;padding:11px 12px;background:#142033ea;border-radius:12px;color:#fff;box-shadow:0 6px 24px #0003}.title{font-size:15px;font-weight:700}.badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:12px;background:#2aa4a8;font-size:11px}.buttons,.views{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.panel button{padding:8px 10px;border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:#fff;cursor:pointer}.panel button:hover{background:#ffffff30}.views button{font-size:12px;padding:6px 9px}.poirow{display:flex;gap:6px;align-items:center;margin-top:8px}.poirow select{min-width:250px;max-width:390px;padding:8px 9px;border:1px solid #ffffff55;border-radius:7px;background:#f8fbff;color:#1c3046;font-family:inherit}.poirow button{background:#2aa4a8}.info{position:absolute;z-index:20;bottom:12px;left:12px;padding:10px 14px;background:#142033ea;color:#fff;border-radius:9px;max-width:980px;line-height:1.55;font-size:13px;box-shadow:0 5px 20px #0003}.tip{position:absolute;z-index:20;right:12px;top:12px;padding:9px 12px;border-radius:8px;background:#ffffffea;color:#24364b;font-size:12px;box-shadow:0 4px 18px #0002}.legend{position:absolute;z-index:20;right:12px;bottom:12px;width:205px;padding:10px 12px;border-radius:9px;background:#fffffff2;color:#24364b;font-size:11px;line-height:1.65;box-shadow:0 4px 18px #0002}.sw{display:inline-block;width:16px;height:7px;border-radius:3px;margin-right:6px}.muted{opacity:.72}@media(max-width:760px){.panel{right:12px}.poirow{display:block}.poirow select{min-width:0;width:100%;box-sizing:border-box}.poirow button{margin-top:6px}.legend{display:none}.tip{top:auto;bottom:78px}}

<body>
<div id="map"></div>
<div class="panel"><span class="title">北京建筑大学 · 大兴校区 GIS</span><span class="badge">本地 OSM 快照</span>
<div class="buttons"><button onclick="show2D()">🗺️ 二维校园</button><button onclick="show3D()">🏢 三维校园</button><button onclick="focusCampus3D()">🎯 校园全景</button><button onclick="location.href='farm3d.html'">🌱 开心农场</button><button onclick="location.href='index.html'">⌂ 首页</button></div>

<script>
const FALLBACK_VIEW=Cesium.Rectangle.fromDegrees(116.2754,39.7426,116.2850,39.7518);
const LOCAL={boundary:'data/osm-campus-boundary.geojson',buildings:'data/osm-buildings.geojson',roads:'data/osm-roads.geojson',areas:'data/osm-areas.geojson'};
const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,fullscreenButton:false,selectionIndicator:true,infoBox:false});
viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));
viewer.scene.globe.depthTestAgainstTerrain=false;viewer.scene.globe.enableLighting=false;viewer.scene.fog.enabled=true;viewer.scene.fog.density=.00012;viewer.scene.skyAtmosphere.show=true;viewer.scene.shadowMap.enabled=true;viewer.clock.shouldAnimate=false;
let boundaryDS=null,buildingDS=null,roadDS=null,areaDS=null,bounds=null,currentMode='2d',sceneBuilt=false;
const counts={buildings:0,roads:0,areas:0,namedBuildings:0,namedAreas:0};const poiIndex=new Map();
const palette={dorm:'#d7b48b',teaching:'#c78663',research:'#9c7459',library:'#b05243',sport:'#9fb4c5',service:'#d9b45d',generic:'#b2a48f'};
function info(t){document.getElementById('info').innerHTML=t}
function prop(e,n){try{const p=e.properties&&e.properties[n];return p&&p.getValue?String(p.getValue()):''}catch(_){return''}}
function displayName(e){return(prop(e,'name')||prop(e,'name:zh')||'').replace('北京建筑大学大兴校区','').trim()}
function buildingClass(e){const n=(prop(e,'name')||prop(e,'name:zh')).toLowerCase(),t=prop(e,'building'),a=prop(e,'amenity');if(t==='dormitory'||/\d+号楼|宿舍/.test(n))return'dorm';if(t==='stadium'||/体育馆|气膜/.test(n))return'sport';if(a==='library'||/图书馆/.test(n))return'library';if(a==='restaurant'||/园$|食堂|餐厅|活动中心|医务/.test(n))return'service';if(/教学楼|学院|实验|工程实践|行政楼/.test(n))return n.includes('教学楼')?'teaching':'research';return'generic'}
function defaultHeight(e){const c=buildingClass(e),n=displayName(e);if(c==='dorm')return 21;if(c==='teaching')return 20;if(c==='library')return 24;if(c==='sport')return n.includes('气膜')?15:22;if(c==='service')return 14;if(c==='research')return n.includes('行政楼')?20:18;return 15}
function buildingHeight(e){const h=parseFloat(prop(e,'height'));if(h>0)return h;const l=parseFloat(prop(e,'building:levels'));if(l>0)return l*3.3;return defaultHeight(e)}
function buildingColor(e){return Cesium.Color.fromCssColorString(palette[buildingClass(e)]||palette.generic)}
function collectCoords(g,out){if(!g)return;if(typeof g[0]==='number'){out.push(g);return}g.forEach(x=>collectCoords(x,out))}
function geojsonBounds(g){const p=[];(g.features||[]).forEach(f=>collectCoords(f.geometry&&f.geometry.coordinates,p));if(!p.length)return null;const x=p.map(v=>v[0]),y=p.map(v=>v[1]);return{w:Math.min(...x),s:Math.min(...y),e:Math.max(...x),n:Math.max(...y)}}
function paddedRect(b,p=.00025){return b?Cesium.Rectangle.fromDegrees(b.w-p,b.s-p,b.e+p,b.n+p):FALLBACK_VIEW}
async function fetchGeo(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status+' '+url);return r.json()}
async function loadBoundary(){if(boundaryDS)return boundaryDS;const g=await fetchGeo(LOCAL.boundary);bounds=geojsonBounds(g);boundaryDS=await Cesium.GeoJsonDataSource.load(g,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#22b6c6'),strokeWidth:4,fill:Cesium.Color.fromCssColorString('#55d2ca').withAlpha(.025)});viewer.dataSources.add(boundaryDS);return boundaryDS}
async function loadLayer(url,opt,key){const g=await fetchGeo(url);counts[key]=(g.features||[]).length;const ds=await Cesium.GeoJsonDataSource.load(g,opt);viewer.dataSources.add(ds);return ds}
function entityCenter(e){try{const h=e.polygon&&e.polygon.hierarchy.getValue(Cesium.JulianDate.now());return h&&h.positions&&h.positions.length?Cesium.BoundingSphere.fromPoints(h.positions).center:null}catch(_){return null}}
function centerLonLat(e){const c=entityCenter(e);if(!c)return null;const q=Cesium.Cartographic.fromCartesian(c);return[Cesium.Math.toDegrees(q.longitude),Cesium.Math.toDegrees(q.latitude)]}
function addLabels(){buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;const name=displayName(e),c=entityCenter(e);if(!name||!c)return;e.position=c;e.label=new Cesium.LabelGraphics({text:name,font:'13px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#26384c').withAlpha(.84),pixelOffset:new Cesium.Cartesian2(0,-10),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1450),disableDepthTestDistance:1000})})}
function populatePoi(){const s=document.getElementById('poiSelect');poiIndex.clear();while(s.options.length>1)s.remove(1);const items=buildingDS.entities.values.map(e=>({e,name:displayName(e),cls:buildingClass(e)})).filter(x=>x.name).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));counts.namedBuildings=items.length;const order=['library','teaching','research','sport','service','dorm','generic'],labels={library:'图书馆',teaching:'基础教学楼',research:'学院 / 行政 / 实验',sport:'体育设施',service:'生活服务',dorm:'宿舍',generic:'其他'};order.forEach(c=>{const a=items.filter(x=>x.cls===c);if(!a.length)return;const g=document.createElement('optgroup');g.label=labels[c];a.forEach(x=>{const k=String(prop(x.e,'osm_id')||x.e.id);poiIndex.set(k,x.e);const o=document.createElement('option');o.value=k;o.textContent=x.name;g.appendChild(o)});s.appendChild(g)});s.onchange=()=>s.value&&focusSelectedPoi()}
async function loadBuildings(){if(buildingDS)return buildingDS;await loadBoundary();buildingDS=await loadLayer(LOCAL.buildings,{clampToGround:false},'buildings');addLabels();populatePoi();return buildingDS}
function roadStyle(e){const h=prop(e,'highway');if(['primary','secondary','tertiary','unclassified','residential'].includes(h))return{w:5,c:'#cfaa68'};if(h==='service')return{w:3.5,c:'#d8b878'};if(['footway','path','pedestrian','steps'].includes(h))return{w:2.2,c:'#eee1bd'};return{w:2.4,c:'#d8c89d'}}
function styleRoads(){roadDS.entities.values.forEach(e=>{if(!e.polyline)return;const s=roadStyle(e);e.polyline.width=s.w;e.polyline.material=Cesium.Color.fromCssColorString(s.c).withAlpha(.95);e.polyline.clampToGround=true})}
function areaStyle(e){const l=prop(e,'leisure'),s=prop(e,'sport'),u=prop(e,'landuse'),a=prop(e,'amenity');if(l==='pitch')return{f:s==='soccer'?'#5f9e54':'#78976e',a:.62,o:'#f3f5ee'};if(l==='track')return{f:'#b56f5b',a:.52,o:'#f1dccb'};if(l==='garden'||u==='grass'||u==='meadow')return{f:'#69a05c',a:.42,o:'#dfead8'};if(u==='recreation_ground'||l==='park')return{f:'#78a96a',a:.45,o:'#e3eddf'};if(a==='parking')return{f:'#aaa79f',a:.35,o:'#dedbd2'};return{f:'#b7b18d',a:.26,o:'#e6e1cf'}}
function styleAreas(){counts.namedAreas=0;areaDS.entities.values.forEach(e=>{if(!e.polygon)return;const s=areaStyle(e);e.polygon.material=Cesium.Color.fromCssColorString(s.f).withAlpha(s.a);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString(s.o).withAlpha(.75);const n=prop(e,'name')||prop(e,'name:zh'),c=entityCenter(e);if(n&&c){counts.namedAreas++;e.position=c;e.label=new Cesium.LabelGraphics({text:n,font:'12px Microsoft YaHei',fillColor:Cesium.Color.fromCssColorString('#223829'),showBackground:true,backgroundColor:Cesium.Color.WHITE.withAlpha(.8),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1350),disableDepthTestDistance:900})}})}
async function loadContext(){if(!roadDS){roadDS=await loadLayer(LOCAL.roads,{clampToGround:true},'roads');styleRoads()}if(!areaDS){areaDS=await loadLayer(LOCAL.areas,{clampToGround:true},'areas');styleAreas()}return{roads:!!roadDS,areas:!!areaDS}}
function overlayEntity(o){o.name='campus-scene';o.properties={sceneOverlay:true};return viewer.entities.add(o)}
function groundRect(w,s,e,n,color,alpha=.45){return overlayEntity({rectangle:{coordinates:Cesium.Rectangle.fromDegrees(w,s,e,n),height:.12,material:Cesium.Color.fromCssColorString(color).withAlpha(alpha),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.18)}})}
function pathLine(coords,width=4,color='#d8b878',alpha=.9){return overlayEntity({polyline:{positions:Cesium.Cartesian3.fromDegreesArray(coords),width,material:Cesium.Color.fromCssColorString(color).withAlpha(alpha),clampToGround:true}})}
function tree(lon,lat,scale=1,tone='#4e8b48'){overlayEntity({position:Cesium.Cartesian3.fromDegrees(lon,lat,2.4*scale),cylinder:{length:4.8*scale,topRadius:.35*scale,bottomRadius:.5*scale,material:Cesium.Color.fromCssColorString('#74513a')}});overlayEntity({position:Cesium.Cartesian3.fromDegrees(lon,lat,7*scale),ellipsoid:{radii:new Cesium.Cartesian3(3.5*scale,3.5*scale,4.7*scale),material:Cesium.Color.fromCssColorString(tone)}})}
function treeRow(x1,y1,x2,y2,count,scale=.68){for(let i=0;i<count;i++){const t=count===1?0:i/(count-1);tree(x1+(x2-x1)*t,y1+(y2-y1)*t,scale,i%3===0?'#477d43':'#568e4d')}}
function zoneLabel(lon,lat,text,color){overlayEntity({position:Cesium.Cartesian3.fromDegrees(lon,lat,5),label:{text,font:'bold 15px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString(color).withAlpha(.88),pixelOffset:new Cesium.Cartesian2(0,-12),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(250,1800),disableDepthTestDistance:1200}})}
function landmarkPosition(e,z){const ll=centerLonLat(e);return ll?Cesium.Cartesian3.fromDegrees(ll[0],ll[1],z):null}
function findBuilding(name){return buildingDS.entities.values.find(e=>displayName(e)===name)}
function addConnector(a,b,width=9,color='#e5d4b6'){const ea=findBuilding(a),eb=findBuilding(b);if(!ea||!eb)return;const ca=centerLonLat(ea),cb=centerLonLat(eb);if(!ca||!cb)return;pathLine([ca[0],ca[1],cb[0],cb[1]],width,color,.72)}
function addEntryPlaza(e,color='#d9c7a7',sx=38,sy=24){const ll=centerLonLat(e);if(!ll)return;overlayEntity({position:Cesium.Cartesian3.fromDegrees(ll[0],ll[1]-.00016,.18),ellipse:{semiMajorAxis:sx,semiMinorAxis:sy,material:Cesium.Color.fromCssColorString(color).withAlpha(.46),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.35)}})}
function addLandmarkArchitecture(){buildingDS.entities.values.forEach(e=>{const n=displayName(e),h=buildingHeight(e);if(!n)return;const pos=z=>landmarkPosition(e,z);if(n.includes('图书馆')){overlayEntity({position:pos(h+1.2),box:{dimensions:new Cesium.Cartesian3(54,40,2.4),material:Cesium.Color.fromCssColorString('#eee2cb'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#7b4037')}});overlayEntity({position:pos(h+4.2),box:{dimensions:new Cesium.Cartesian3(18,18,3.8),material:Cesium.Color.fromCssColorString('#8f4037'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#f4dfc3')}});addEntryPlaza(e,'#dcc7a6',44,28)}
else if(n==='综合体育馆'){overlayEntity({position:pos(h+1),ellipsoid:{radii:new Cesium.Cartesian3(44,33,7.5),material:Cesium.Color.fromCssColorString('#d9e1e4'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#7e9299')}})}
else if(n==='气膜体育馆'){overlayEntity({position:pos(h-1),ellipsoid:{radii:new Cesium.Cartesian3(46,22,7),material:Cesium.Color.fromCssColorString('#e7edf0'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#9aa8ad')}})}
else if(/^基础教学楼[A-D]$/.test(n)){const vertical=/[BD]$/.test(n);overlayEntity({position:pos(h+1),box:{dimensions:new Cesium.Cartesian3(vertical?10:72,vertical?38:10,2),material:Cesium.Color.fromCssColorString('#eee0cf'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#9a654c')}})}
else if(n==='行政楼'){overlayEntity({position:pos(h+1),box:{dimensions:new Cesium.Cartesian3(32,18,2.2),material:Cesium.Color.fromCssColorString('#ead8c4'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#815241')}});overlayEntity({position:pos(h+7),cylinder:{length:10,topRadius:.35,bottomRadius:.35,material:Cesium.Color.fromCssColorString('#c9c9c9')}});addEntryPlaza(e,'#d7c5a8',28,16)}
else if(/学院|工程实践创新中心/.test(n)){overlayEntity({position:pos(h+.8),box:{dimensions:new Cesium.Cartesian3(34,8,1.6),material:Cesium.Color.fromCssColorString('#d8c2a8'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#86624e')}})}
else if(/^\d+号楼$/.test(n)){overlayEntity({position:pos(h+.7),box:{dimensions:new Cesium.Cartesian3(28,7,1.4),material:Cesium.Color.fromCssColorString('#ecd9bd'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#9b765e')}})}})}
function addTeachingGroup(){groundRect(116.27742,39.74690,116.28010,39.74816,'#d9c9aa',.20);addConnector('基础教学楼A','基础教学楼B',6);addConnector('基础教学楼B','基础教学楼C',6);addConnector('基础教学楼C','基础教学楼D',6);addConnector('基础教学楼D','基础教学楼A',6);pathLine([116.27805,39.74754,116.27991,39.74755],4,'#f0e2c9',.8);pathLine([116.27820,39.74778,116.27943,39.74778],4,'#f0e2c9',.8);treeRow(116.27762,39.74688,116.28002,39.74688,10,.62);treeRow(116.27761,39.74812,116.28001,39.74812,10,.62);zoneLabel(116.27878,39.74746,'基础教学楼 A–D 组团','#87513e')}
function addLibraryCore(){groundRect(116.28067,39.74408,116.28208,39.74528,'#d9c7a7',.30);pathLine([116.28056,39.74478,116.28142,39.74476],8,'#d5bc91',.82);treeRow(116.28080,39.74414,116.28080,39.74518,6,.66);treeRow(116.28200,39.74414,116.28200,39.74518,6,.66);zoneLabel(116.28145,39.74492,'图书馆 · 校园核心','#8f3d34')}
function addLifeGroup(){groundRect(116.27630,39.74818,116.27855,39.75055,'#d7b48b',.10);for(let y=39.74828;y<39.75048;y+=.00032)pathLine([116.27642,y,116.27843,y],2.5,'#e7d9bd',.72);treeRow(116.27636,39.74822,116.27636,39.75050,9,.58);treeRow(116.27847,39.74822,116.27847,39.75050,9,.58);zoneLabel(116.27740,39.74945,'宿舍生活区','#7d624f')}
function addResearchSpine(){pathLine([116.28218,39.74420,116.28218,39.74795],6,'#d8c19a',.70);treeRow(116.28238,39.74438,116.28238,39.74780,12,.58);zoneLabel(116.28275,39.74602,'学院 / 实验教学轴','#6f5745')}
function addSportsEdge(){groundRect(116.27720,39.74830,116.28185,39.75116,'#65a15b',.07);treeRow(116.27995,39.74910,116.28192,39.74910,8,.62);treeRow(116.27990,39.75102,116.28165,39.75102,7,.62);zoneLabel(116.28065,39.75010,'体育运动区','#3f7446')}
function buildScene(){if(sceneBuilt)return;groundRect(116.27905,39.74310,116.28215,39.74342,'#d6c5a2',.78);groundRect(116.28036,39.74322,116.28075,39.74685,'#d7c398',.58);groundRect(116.27972,39.74488,116.28134,39.74518,'#d9c9aa',.50);overlayEntity({position:Cesium.Cartesian3.fromDegrees(116.28056,39.74327,5),box:{dimensions:new Cesium.Cartesian3(55,7,10),material:Cesium.Color.fromCssColorString('#a94338'),outline:true,outlineColor:Cesium.Color.fromCssColorString('#f2e6d5')},label:{text:'北京建筑大学',font:'bold 17px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#762d27').withAlpha(.9),pixelOffset:new Cesium.Cartesian2(0,-32),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1500),disableDepthTestDistance:1200}});treeRow(116.28018,39.74355,116.28018,39.74670,15,.72);treeRow(116.28093,39.74355,116.28093,39.74670,15,.72);treeRow(116.27935,39.74350,116.28182,39.74350,11,.66);overlayEntity({position:Cesium.Cartesian3.fromDegrees(116.28056,39.74478,1),ellipse:{semiMajorAxis:38,semiMinorAxis:26,material:Cesium.Color.fromCssColorString('#79aa69').withAlpha(.62),outline:true,outlineColor:Cesium.Color.WHITE.withAlpha(.42)}});overlayEntity({position:Cesium.Cartesian3.fromDegrees(116.28056,39.74478,4),cylinder:{length:7,topRadius:5.5,bottomRadius:5.5,material:Cesium.Color.fromCssColorString('#c8ae72')}});overlayEntity({position:Cesium.Cartesian3.fromDegrees(116.28056,39.74478,8),ellipsoid:{radii:new Cesium.Cartesian3(3.4,3.4,3.4),material:Cesium.Color.fromCssColorString('#e6d18d')}});groundRect(116.27745,39.7450,116.28245,39.74825,'#d7b999',.08);groundRect(116.28035,39.7468,116.28365,39.7506,'#d9b88e',.07);zoneLabel(116.28055,39.74362,'南门 · 校园主入口','#8f3d34');addLibraryCore();addTeachingGroup();addLifeGroup();addResearchSpine();addSportsEdge();addLandmarkArchitecture();sceneBuilt=true}
function sceneVisible(show){viewer.entities.values.forEach(e=>{try{if(e.properties&&e.properties.sceneOverlay&&e.properties.sceneOverlay.getValue())e.show=show}catch(_){}})}
function paint2D(){buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;e.polygon.height=0;e.polygon.extrudedHeight=0;e.polygon.material=buildingColor(e).withAlpha(.83);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString('#725640');if(e.label)e.label.show=true});sceneVisible(false)}
function paint3D(){buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;const h=buildingHeight(e),c=buildingClass(e);e.polygon.height=0;e.polygon.extrudedHeight=h;e.polygon.material=buildingColor(e).withAlpha(.97);e.polygon.outline=true;e.polygon.outlineColor=c==='library'?Cesium.Color.fromCssColorString('#762e28'):Cesium.Color.WHITE.withAlpha(.52);e.polygon.shadows=Cesium.ShadowMode.ENABLED;if(e.label)e.label.show=true});buildScene();sceneVisible(true)}

function focusCampus3D(){if(currentMode!=='3d'){show3D();return}viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(116.2767,39.7418,650),orientation:{heading:Cesium.Math.toRadians(31),pitch:Cesium.Math.toRadians(-32),roll:0},duration:.9})}

function tourView(k){if(currentMode!=='3d'){show3D().then(()=>tourView(k));return}const v=tours[k];viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(v[0],v[1],v[2]),orientation:{heading:Cesium.Math.toRadians(v[3]),pitch:Cesium.Math.toRadians(v[4]),roll:0},duration:.8})}
function focusPoi(e){if(!e)return;const c=entityCenter(e);if(!c)return;viewer.selectedEntity=e;const q=Cesium.Cartographic.fromCartesian(c),lon=Cesium.Math.toDegrees(q.longitude),lat=Cesium.Math.toDegrees(q.latitude),n=displayName(e)||'校园建筑',h=buildingHeight(e),src=(prop(e,'height')||prop(e,'building:levels'))?'OSM height / building:levels':'教学默认高度';if(currentMode==='3d')viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon-.0007,lat-.00075,150),orientation:{heading:Cesium.Math.toRadians(28),pitch:Cesium.Math.toRadians(-35),roll:0},duration:.75});else viewer.camera.flyTo({destination:Cesium.Rectangle.fromDegrees(lon-.00065,lat-.00048,lon+.00065,lat+.00048),duration:.65});info(`<b>📍 ${n}</b>｜类型：${buildingClass(e)}｜高度约 ${h.toFixed(1)} m｜${src}｜位置来自仓库内 OSM footprint。`)}
function focusSelectedPoi(){const s=document.getElementById('poiSelect');if(s&&s.value)focusPoi(poiIndex.get(s.value))}
function status(){return`本地 OSM：建筑 <b>${counts.buildings}</b>（${counts.namedBuildings} 个可导航）、道路 <b>${counts.roads}</b>、体育/绿地等地块 <b>${counts.areas}</b>（${counts.namedAreas} 个有名称）。`}
async function show2D(){currentMode='2d';viewer.scene.morphTo2D(0);await loadBoundary();await Promise.all([loadBuildings(),loadContext()]);paint2D();await focusCampus();info(`<b>二维校园 GIS</b>｜边界、建筑、道路和主要地块均读取仓库本地 GeoJSON；真实数据范围自动聚焦。${status()}`)}
async function show3D(){currentMode='3d';viewer.scene.morphTo3D(0);await loadBoundary();await Promise.all([loadBuildings(),loadContext()]);paint3D();focusCampus3D();info(`<b>三维校园 GIS</b>｜二维/三维完全共用真实 footprint；本次进一步补齐图书馆前场、基础教学楼 A–D 连廊、学院教学轴、宿舍生活区步行网络与体育区绿化边缘，使校园组团关系更接近大兴校区。${status()}`)}
const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);handler.setInputAction(m=>{const p=viewer.scene.pick(m.position);if(!Cesium.defined(p)||!p.id||!buildingDS||!buildingDS.entities.contains(p.id))return;focusPoi(p.id);const k=String(prop(p.id,'osm_id')||p.id.id),s=document.getElementById('poiSelect');if(poiIndex.has(k)&&s)s.value=k},Cesium.ScreenSpaceEventType.LEFT_CLICK);
(async()=>{const q=new URLSearchParams(location.search);if(q.get('mode')==='3d')await show3D();else await show2D()})().catch(e=>{console.error(e);info('校园 GIS 初始化失败：'+e.message)});

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北建大校园 GIS</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
<style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei"}.bar{position:absolute;z-index:20;top:12px;left:12px;padding:10px;background:#142033e8;border-radius:10px;color:white}.bar button{padding:9px 13px;margin:3px;border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:white;cursor:pointer}.info{position:absolute;z-index:20;bottom:12px;left:12px;padding:10px 14px;background:#142033e8;color:white;border-radius:8px;max-width:820px}</style></head>
<body><div id="map"></div><div class="bar"><b>北京建筑大学 · 大兴校区 GIS</b><br><button onclick="show2D()">🗺️ 二维校园</button><button onclick="show3D()">🏢 三维校园</button><button onclick="location.href='farm3d.html'">🌱 开心农场</button><button onclick="location.href='index.html'">⌂ 学校首页</button></div><div class="info" id="info">正在读取校园开放空间数据……</div>
<script>
const FALLBACK_VIEW=Cesium.Rectangle.fromDegrees(116.2735,39.7418,116.3005,39.7635);
const OSM_CAMPUS_WAY='W546474045';
const OSM_BOUNDARY_URL='https://nominatim.openstreetmap.org/lookup?osm_ids='+OSM_CAMPUS_WAY+'&format=geojson&polygon_geojson=1';
const OVERPASS_URL='https://overpass-api.de/api/interpreter';
const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false});
viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));viewer.scene.globe.depthTestAgainstTerrain=false;
let boundaryDS=null,buildingDS=null,bounds=null;
function info(t){document.getElementById('info').innerHTML=t}
function prop(entity,name){try{const p=entity.properties&&entity.properties[name];return p&&p.getValue?String(p.getValue()):''}catch(e){return''}}
function buildingHeight(e){const h=parseFloat(prop(e,'height'));if(Number.isFinite(h)&&h>0)return h;const lv=parseFloat(prop(e,'building:levels'));if(Number.isFinite(lv)&&lv>0)return lv*3.3;return 18}
function collectCoords(g,out){if(!g)return;if(typeof g[0]==='number'){out.push(g);return}g.forEach(x=>collectCoords(x,out))}
function geojsonBounds(geo){const pts=[];(geo.features||[]).forEach(f=>collectCoords(f.geometry&&f.geometry.coordinates,pts));if(!pts.length)return null;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return {w:Math.min(...xs),s:Math.min(...ys),e:Math.max(...xs),n:Math.max(...ys)}}
async function loadBoundary(){if(boundaryDS)return boundaryDS;try{const r=await fetch(OSM_BOUNDARY_URL,{headers:{Accept:'application/geo+json,application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const geo=await r.json();bounds=geojsonBounds(geo);boundaryDS=await Cesium.GeoJsonDataSource.load(geo,{clampToGround:true,stroke:Cesium.Color.CYAN,strokeWidth:4,fill:Cesium.Color.CYAN.withAlpha(.07)});viewer.dataSources.add(boundaryDS);return boundaryDS}catch(e){console.warn(e);return null}}
function overpassToGeoJSON(data){const nodes=new Map(),features=[];(data.elements||[]).forEach(x=>{if(x.type==='node')nodes.set(x.id,[x.lon,x.lat])});(data.elements||[]).forEach(x=>{if(x.type!=='way'||!x.tags||!x.tags.building)return;const ring=(x.nodes||[]).map(id=>nodes.get(id)).filter(Boolean);if(ring.length<4)return;if(ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1])ring.push(ring[0]);features.push({type:'Feature',properties:{osm_id:x.id,...x.tags},geometry:{type:'Polygon',coordinates:[ring]}})});return {type:'FeatureCollection',features}}
async function loadBuildings(){if(buildingDS)return buildingDS;await loadBoundary();if(!bounds)return null;info('<b>校园建筑</b>｜正在从 OpenStreetMap 读取校园范围内建筑 footprint……');try{const pad=.0005,q=`[out:json][timeout:25];(way["building"](${bounds.s-pad},${bounds.w-pad},${bounds.n+pad},${bounds.e+pad}););out body;>;out skel qt;`;const r=await fetch(OVERPASS_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw new Error('HTTP '+r.status);const geo=overpassToGeoJSON(await r.json());if(!geo.features.length)throw new Error('未返回建筑');buildingDS=await Cesium.GeoJsonDataSource.load(geo,{clampToGround:false});viewer.dataSources.add(buildingDS);return buildingDS}catch(e){console.warn('Overpass buildings unavailable',e);return null}}
function paint2D(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;e.polygon.height=0;e.polygon.extrudedHeight=0;e.polygon.material=Cesium.Color.fromCssColorString('#d9a96d').withAlpha(.72);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString('#82572e')})}
function paint3D(){if(!buildingDS)return;buildingDS.entities.values.forEach((e,i)=>{if(!e.polygon)return;const h=buildingHeight(e);e.polygon.height=0;e.polygon.extrudedHeight=h;e.polygon.material=[Cesium.Color.CORNFLOWERBLUE,Cesium.Color.STEELBLUE,Cesium.Color.LIGHTSTEELBLUE][i%3].withAlpha(.92);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.WHITE.withAlpha(.8)})}
async function focusCampus(){if(boundaryDS){await viewer.flyTo(boundaryDS,{duration:.6});return}viewer.camera.setView({destination:FALLBACK_VIEW})}
async function show2D(){viewer.scene.morphTo2D(0);const b=await loadBoundary();const buildings=await loadBuildings();if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint2D()}await focusCampus();info(`<b>二维校园 GIS</b>｜校园边界来自 OSM Way 546474045；${buildings?'建筑 footprint 与二维底图已经叠加':'建筑服务暂不可用'}。道路、步行路、体育设施和主要地块继续按同一开放数据路线补充。`)}
async function show3D(){viewer.scene.morphTo3D(0);await loadBoundary();const buildings=await loadBuildings();if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint3D();await viewer.flyTo(buildingDS,{duration:.7,offset:new Cesium.HeadingPitchRange(Cesium.Math.toRadians(20),Cesium.Math.toRadians(-35),1100)});info('<b>三维校园 GIS</b>｜直接复用二维 OSM 建筑 footprint 拉伸。优先读取 height，其次 building:levels×3.3m，均缺失时使用明确的教学默认高度 18m。位置合理优先，不作为测绘成果。')}else{await focusCampus();info('<b>三维校园 GIS</b>｜本次 Overpass 建筑服务未返回数据；校园边界仍可显示。刷新或稍后重试即可，不再回退到历史矩形建筑。')}}
const mode=new URLSearchParams(location.search).get('mode');if(mode==='3d')show3D();else show2D();
</script></body></html>

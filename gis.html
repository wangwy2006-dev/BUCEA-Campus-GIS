<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北建大校园 GIS</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
<style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei"}.bar{position:absolute;z-index:20;top:12px;left:12px;padding:10px;background:#142033e8;border-radius:10px;color:white}.bar button{padding:9px 13px;margin:3px;border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:white;cursor:pointer}.info{position:absolute;z-index:20;bottom:12px;left:12px;padding:10px 14px;background:#142033e8;color:white;border-radius:8px;max-width:900px;line-height:1.55}</style></head>
<body><div id="map"></div><div class="bar"><b>北京建筑大学 · 大兴校区 GIS</b><br><button onclick="show2D()">🗺️ 二维校园</button><button onclick="show3D()">🏢 三维校园</button><button onclick="location.href='farm3d.html'">🌱 开心农场</button><button onclick="location.href='index.html'">⌂ 学校首页</button></div><div class="info" id="info">正在读取项目内校园空间数据……</div>
<script>
const FALLBACK_VIEW=Cesium.Rectangle.fromDegrees(116.2754,39.7426,116.2850,39.7518);
const LOCAL={boundary:'data/osm-campus-boundary.geojson',buildings:'data/osm-buildings.geojson',roads:'data/osm-roads.geojson',areas:'data/osm-areas.geojson'};
const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false});
viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));viewer.scene.globe.depthTestAgainstTerrain=false;
let boundaryDS=null,buildingDS=null,roadDS=null,areaDS=null,bounds=null;
const counts={buildings:0,roads:0,areas:0};
function info(t){document.getElementById('info').innerHTML=t}
function prop(entity,name){try{const p=entity.properties&&entity.properties[name];return p&&p.getValue?String(p.getValue()):''}catch(e){return''}}
function buildingHeight(e){const h=parseFloat(prop(e,'height'));if(Number.isFinite(h)&&h>0)return h;const lv=parseFloat(prop(e,'building:levels'));if(Number.isFinite(lv)&&lv>0)return lv*3.3;return 18}
function collectCoords(g,out){if(!g)return;if(typeof g[0]==='number'){out.push(g);return}g.forEach(x=>collectCoords(x,out))}
function geojsonBounds(geo){const pts=[];(geo.features||[]).forEach(f=>collectCoords(f.geometry&&f.geometry.coordinates,pts));if(!pts.length)return null;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return {w:Math.min(...xs),s:Math.min(...ys),e:Math.max(...xs),n:Math.max(...ys)}}
async function fetchGeo(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status+' '+url);return r.json()}
async function loadBoundary(){if(boundaryDS)return boundaryDS;try{const geo=await fetchGeo(LOCAL.boundary);bounds=geojsonBounds(geo);boundaryDS=await Cesium.GeoJsonDataSource.load(geo,{clampToGround:true,stroke:Cesium.Color.CYAN,strokeWidth:4,fill:Cesium.Color.CYAN.withAlpha(.055)});viewer.dataSources.add(boundaryDS);return boundaryDS}catch(e){console.warn('Local campus boundary unavailable',e);return null}}
async function loadLocalLayer(url,options,countKey){try{const geo=await fetchGeo(url);counts[countKey]=(geo.features||[]).length;const ds=await Cesium.GeoJsonDataSource.load(geo,options);viewer.dataSources.add(ds);return ds}catch(e){console.warn('Local layer unavailable:',url,e);return null}}
function addBuildingLabels(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon||e.label)return;const name=prop(e,'name')||prop(e,'name:zh');if(!name)return;try{const hierarchy=e.polygon.hierarchy.getValue(Cesium.JulianDate.now());if(!hierarchy||!hierarchy.positions||!hierarchy.positions.length)return;const center=Cesium.BoundingSphere.fromPoints(hierarchy.positions).center;e.position=center;e.label=new Cesium.LabelGraphics({text:name,font:'13px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#26384c').withAlpha(.78),pixelOffset:new Cesium.Cartesian2(0,-8),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,2200),disableDepthTestDistance:900})}catch(err){console.warn('label skipped',name,err)}})}
async function loadBuildings(){if(buildingDS)return buildingDS;await loadBoundary();buildingDS=await loadLocalLayer(LOCAL.buildings,{clampToGround:false},'buildings');if(buildingDS)addBuildingLabels();return buildingDS}
async function loadContextLayers(){if(!roadDS)roadDS=await loadLocalLayer(LOCAL.roads,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#f3c873'),strokeWidth:3},'roads');if(!areaDS)areaDS=await loadLocalLayer(LOCAL.areas,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#4f7f48'),strokeWidth:2,fill:Cesium.Color.fromCssColorString('#70a665').withAlpha(.28)},'areas');return {roads:!!roadDS,areas:!!areaDS}}
function paint2D(){if(!buildingDS)return;buildingDS.entities.values.forEach(e=>{if(!e.polygon)return;e.polygon.height=0;e.polygon.extrudedHeight=0;e.polygon.material=Cesium.Color.fromCssColorString('#d9a96d').withAlpha(.82);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString('#82572e');if(e.label)e.label.show=true})}
function paint3D(){if(!buildingDS)return;buildingDS.entities.values.forEach((e,i)=>{if(!e.polygon)return;const h=buildingHeight(e);e.polygon.height=0;e.polygon.extrudedHeight=h;const type=prop(e,'building');let color=Cesium.Color.LIGHTSTEELBLUE;if(type==='dormitory')color=Cesium.Color.fromCssColorString('#d6b58c');else if(type==='stadium')color=Cesium.Color.fromCssColorString('#b9c9d9');else color=[Cesium.Color.CORNFLOWERBLUE,Cesium.Color.STEELBLUE,Cesium.Color.LIGHTSTEELBLUE][i%3];e.polygon.material=color.withAlpha(.94);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.WHITE.withAlpha(.72);if(e.label)e.label.show=true})}
async function focusCampus(){if(boundaryDS){await viewer.flyTo(boundaryDS,{duration:.55});return}viewer.camera.setView({destination:FALLBACK_VIEW})}
function statusText(ctx){return `真实 OSM 本地快照：建筑 <b>${counts.buildings}</b>、道路 <b>${counts.roads}</b>、体育/绿地等地块 <b>${counts.areas}</b>；${ctx.roads?'道路已加载':'道路文件异常'}，${ctx.areas?'地块已加载':'地块文件异常'}。`}
async function show2D(){viewer.scene.morphTo2D(0);await loadBoundary();const [buildings,ctx]=await Promise.all([loadBuildings(),loadContextLayers()]);if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint2D()}await focusCampus();info(`<b>二维校园 GIS</b>｜校园边界与专题数据均从仓库本地 GeoJSON 读取，不再依赖页面运行时 Overpass。${statusText(ctx)}`)}
async function show3D(){viewer.scene.morphTo3D(0);await loadBoundary();const [buildings,ctx]=await Promise.all([loadBuildings(),loadContextLayers()]);if(boundaryDS)boundaryDS.show=true;if(buildingDS){buildingDS.show=true;paint3D();await viewer.flyTo(buildingDS,{duration:.7,offset:new Cesium.HeadingPitchRange(Cesium.Math.toRadians(18),Cesium.Math.toRadians(-34),1050)});info(`<b>三维校园 GIS</b>｜与二维共用同一套本地建筑 footprint。高度优先使用 height，其次 building:levels×3.3m，缺失使用18m教学默认值；主要有名建筑显示名称。${statusText(ctx)}`)}else{await focusCampus();info('<b>三维校园 GIS</b>｜校园边界已加载，但本地建筑文件异常，请检查 data/osm-buildings.geojson。')}}
const mode=new URLSearchParams(location.search).get('mode');if(mode==='3d')show3D();else show2D();
</script></body></html>

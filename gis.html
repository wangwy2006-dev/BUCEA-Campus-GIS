<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北建大校园 GIS</title><script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css"><style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei"}.bar{position:absolute;z-index:20;top:12px;left:12px;padding:10px;background:#142033e8;border-radius:10px;color:white}.bar button{padding:9px 13px;margin:3px;border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:white;cursor:pointer}.info{position:absolute;z-index:20;bottom:12px;left:12px;padding:10px 14px;background:#142033e8;color:white;border-radius:8px;max-width:650px}.farmPanel{display:none;position:absolute;z-index:30;inset:0;background:linear-gradient(#83c9f4 0 38%,#a9d879 38% 100%);overflow:hidden}.farmTop{position:absolute;z-index:5;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;color:white}.farmTitle{font-size:26px;font-weight:700;text-shadow:0 2px 5px #234}.back{padding:9px 14px;border:0;border-radius:8px;background:#17324dcc;color:white}.sun{position:absolute;right:10%;top:10%;width:85px;height:85px;border-radius:50%;background:#ffd34d;box-shadow:0 0 40px #fff27a;animation:pulse 2s infinite alternate}.cloud{position:absolute;top:16%;left:-180px;font-size:80px;animation:cloud 18s linear infinite}.field{position:absolute;left:8%;right:8%;bottom:8%;height:45%;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;perspective:700px}.bed{background:repeating-linear-gradient(90deg,#6e3d1e 0 12px,#5a321b 12px 22px);border:5px solid #d4a35d;border-radius:10px;transform:rotateX(35deg);box-shadow:0 10px 20px #0003;display:flex;align-items:center;justify-content:center;font-size:42px}.greenhouse{position:absolute;right:10%;bottom:48%;width:170px;height:90px;border:5px solid #eef;background:#d9ffff88;border-radius:80px 80px 8px 8px;text-align:center;padding-top:35px;color:#164c45;font-weight:bold}.sensor{position:absolute;padding:8px 12px;background:#123c35dd;color:#fff;border-radius:8px;font-size:13px}.s1{left:12%;bottom:48%}.s2{left:36%;bottom:48%}.s3{left:58%;bottom:48%}@keyframes cloud{to{left:110%}}@keyframes pulse{to{transform:scale(1.08)}} </style></head><body><div id="map"></div><div class="bar"><b>北京建筑大学 · 大兴校区 GIS</b><br><button onclick="show2D()">🗺️ 二维校园</button><button onclick="show3D()">🏢 三维校园</button><button onclick="showFarm()">🌱 开心农场</button><button onclick="location.href='index.html'">⌂ 学校首页</button></div><div class="info" id="info">正在加载校园空间数据……</div><div class="farmPanel" id="farmPanel"><div class="farmTop"><div class="farmTitle">🌻 开心农场 · 虚拟智慧农业实验场</div><button class="back" onclick="closeFarm()">返回校园 GIS</button></div><div class="sun"></div><div class="cloud">☁️</div><div class="greenhouse">🏡 智慧温室</div><div class="sensor s1">🌡️ 23.6°C<br>空气湿度 58%</div><div class="sensor s2">💧 土壤湿度 42%<br>自动灌溉：待机</div><div class="sensor s3">☀️ 光照 680 lx<br>风速 2.1 m/s</div><div class="field"><div class="bed">🌻🌻🌻</div><div class="bed">🥬🥬🥬</div><div class="bed">🌽🌽🌽</div><div class="bed">🍅🍅🍅</div></div></div><script>
const C={lon:116.292065,lat:39.75511};const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false});viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));viewer.scene.globe.depthTestAgainstTerrain=false;let bds,blg;
function info(t){document.getElementById('info').innerHTML=t}function height(e){try{return Number(e.properties.height.getValue())||20}catch(x){return 20}}
Promise.all([Cesium.GeoJsonDataSource.load('data/campus-boundary.geojson',{clampToGround:true,stroke:Cesium.Color.CYAN,strokeWidth:4,fill:Cesium.Color.CYAN.withAlpha(.10)}),Cesium.GeoJsonDataSource.load('data/campus-buildings.geojson',{clampToGround:false})]).then(([a,b])=>{bds=a;blg=b;viewer.dataSources.add(a);viewer.dataSources.add(b);show2D();}).catch(e=>{console.error(e);info('校园 GeoJSON 加载失败。请检查 data 文件。')});
function paint(mode){if(!blg)return;blg.show=true;blg.entities.values.forEach((e,i)=>{if(!e.polygon)return;e.polygon.height=0;e.polygon.extrudedHeight=mode==='3d'?height(e):0;e.polygon.material=(mode==='3d'?[Cesium.Color.ROYALBLUE,Cesium.Color.CORNFLOWERBLUE,Cesium.Color.STEELBLUE][i%3]:Cesium.Color.DODGERBLUE).withAlpha(mode==='3d'?.9:.55);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.WHITE})}
function show2D(){document.getElementById('farmPanel').style.display='none';viewer.scene.morphTo2D(0);paint('2d');viewer.camera.setView({destination:Cesium.Rectangle.fromDegrees(116.2848,39.7488,116.3000,39.7615)});info('<b>二维校园 GIS</b>｜校园边界 + 建筑轮廓。蓝色建筑与三维校园使用同一份 campus-buildings.geojson。')}
function show3D(){document.getElementById('farmPanel').style.display='none';viewer.scene.morphTo3D(0);paint('3d');viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(C.lon,C.lat,1150),orientation:{heading:Cesium.Math.toRadians(20),pitch:Cesium.Math.toRadians(-45),roll:0}});info('<b>三维校园 GIS</b>｜同一批建筑轮廓依据 height 属性直接拉伸。可拖动、旋转、缩放查看三维建筑群。')}
function showFarm(){document.getElementById('farmPanel').style.display='block';info('开心农场虚拟场景')};function closeFarm(){document.getElementById('farmPanel').style.display='none';show3D()}
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>北京建筑大学大兴校区 · 三维导览</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
<style>
html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,"Microsoft YaHei",sans-serif;background:#d9e8f1}.hero{position:absolute;z-index:20;left:18px;top:18px;width:min(430px,calc(100vw - 36px));box-sizing:border-box;padding:16px 17px;border-radius:16px;background:#10243be8;color:#fff;box-shadow:0 12px 38px #00152c55}.hero h1{font-size:18px;margin:0 0 5px}.hero p{font-size:12px;line-height:1.55;margin:0;color:#d9e7f2}.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.nav button{border:1px solid #ffffff44;background:#ffffff14;color:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.nav button:hover{background:#ffffff2c}.stats{display:flex;gap:12px;margin-top:12px;font-size:11px;color:#bcd1df}.stats b{font-size:16px;color:#fff}.legend{position:absolute;z-index:20;right:16px;bottom:16px;background:#fffffff0;border-radius:12px;padding:11px 13px;color:#263a4a;font-size:11px;line-height:1.7;box-shadow:0 8px 26px #00152c33}.sw{display:inline-block;width:15px;height:7px;border-radius:3px;margin-right:6px}.note{position:absolute;z-index:20;left:18px;bottom:18px;background:#10243bdc;color:#fff;border-radius:10px;padding:9px 12px;font-size:11px;max-width:620px}.back{position:absolute;z-index:20;right:16px;top:16px;background:#fff;color:#17334b;text-decoration:none;border-radius:9px;padding:8px 11px;font-size:12px;box-shadow:0 5px 18px #00152c33}@media(max-width:720px){.hero{left:10px;top:10px}.legend{display:none}.note{left:10px;right:10px;bottom:10px}.back{right:10px;top:auto;bottom:70px}}
</style></head><body>
<div id="map"></div>
<div class="hero"><h1>北京建筑大学 · 大兴校区</h1><p>基于仓库内 OpenStreetMap 校园快照构建的轻量三维导览。真实建筑 footprint 与二维 GIS 共用，三维高度优先读取开放属性，缺失时采用教学展示默认值。</p><div class="nav"><button data-v="all">校园全景</button><button data-v="gate">南门主轴</button><button data-v="library">图书馆</button><button data-v="teaching">教学组团</button><button data-v="life">生活区</button><button data-v="sports">体育区</button><button data-v="college">学院区</button></div><div class="stats"><span><b id="bc">—</b><br>建筑</span><span><b id="rc">—</b><br>道路</span><span><b id="ac">—</b><br>地块</span><span><b id="nc">—</b><br>命名建筑</span></div></div>
<a class="back" href="gis.html?mode=3d">返回校园 GIS</a>
<div class="legend"><b>校园空间辨识</b><br><span class="sw" style="background:#a94d40"></span>图书馆 / 核心<br><span class="sw" style="background:#c78360"></span>教学 / 学院<br><span class="sw" style="background:#d8b58c"></span>宿舍 / 生活<br><span class="sw" style="background:#8fa7b8"></span>体育建筑<br><span class="sw" style="background:#d9b75f"></span>生活服务<br><span class="sw" style="background:#aea18d"></span>其他建筑</div>
<div class="note" id="note">正在读取本地校园数据……</div>
<script>
const viewer=new Cesium.Viewer('map',{imageryProvider:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,sceneModePicker:false,baseLayerPicker:false,navigationHelpButton:false,fullscreenButton:false,selectionIndicator:false,infoBox:false});
viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));viewer.scene.globe.enableLighting=false;viewer.scene.fog.enabled=true;viewer.scene.fog.density=.00012;viewer.scene.shadowMap.enabled=true;
const L={boundary:'data/osm-campus-boundary.geojson',buildings:'data/osm-buildings.geojson',roads:'data/osm-roads.geojson',areas:'data/osm-areas.geojson'};let buildings;
function p(e,k){try{const x=e.properties&&e.properties[k];return x&&x.getValue?String(x.getValue()):''}catch(_){return''}}
function name(e){return(p(e,'name')||p(e,'name:zh')||'').replace('北京建筑大学大兴校区','').trim()}
function cls(e){const n=name(e),b=p(e,'building'),a=p(e,'amenity');if(b==='dormitory'||/号楼|宿舍/.test(n))return'dorm';if(b==='stadium'||/体育馆|气膜/.test(n))return'sport';if(a==='library'||/图书馆/.test(n))return'library';if(a==='restaurant'||/食堂|园$|活动中心|医务/.test(n))return'service';if(/教学楼|学院|实验|工程实践|行政楼/.test(n))return'teaching';return'generic'}
const colors={library:'#a94d40',teaching:'#c78360',dorm:'#d8b58c',sport:'#8fa7b8',service:'#d9b75f',generic:'#aea18d'};
function height(e){const h=parseFloat(p(e,'height'));if(h>0)return h;const l=parseFloat(p(e,'building:levels'));if(l>0)return l*3.3;const c=cls(e),n=name(e);if(c==='dorm')return 21;if(c==='library')return 24;if(c==='sport')return n.includes('气膜')?15:22;if(c==='teaching')return /行政楼/.test(n)?20:/基础教学楼/.test(n)?20:18;if(c==='service')return 14;return 15}
function center(e){try{const h=e.polygon.hierarchy.getValue(Cesium.JulianDate.now());return Cesium.BoundingSphere.fromPoints(h.positions).center}catch(_){return null}}
async function get(u){const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw Error(r.status+' '+u);return r.json()}
async function addGeo(g,opt){const ds=await Cesium.GeoJsonDataSource.load(g,opt);viewer.dataSources.add(ds);return ds}
function tree(lon,lat,s=.75){viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(lon,lat,2.1*s),cylinder:{length:4.2*s,topRadius:.3*s,bottomRadius:.42*s,material:Cesium.Color.fromCssColorString('#76523a')}});viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(lon,lat,6.2*s),ellipsoid:{radii:new Cesium.Cartesian3(3*s,3*s,4*s),material:Cesium.Color.fromCssColorString('#4f8949')}})}
function treeRow(a,b,c,d,n){for(let i=0;i<n;i++){const t=(i+.5)/n;tree(a+(c-a)*t,b+(d-b)*t,.58+(i%3)*.06)}}
function line(a,w=4,col='#d7b579'){viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArray(a),width:w,material:Cesium.Color.fromCssColorString(col).withAlpha(.9),clampToGround:true}})}
function campusComposition(){line([116.28033,39.74302,116.28032,39.74682],8,'#d3b16f');line([116.27945,39.74502,116.28175,39.74502],4,'#e3c990');line([116.27725,39.74822,116.28008,39.74822],3,'#e3c990');treeRow(116.28012,39.74335,116.28012,39.74665,16);treeRow(116.28053,39.74335,116.28053,39.74665,16);treeRow(116.27655,39.75058,116.27855,39.75058,11);treeRow(116.2800,39.75082,116.28195,39.75082,10);viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(116.28033,39.74298,6),box:{dimensions:new Cesium.Cartesian3(44,5,12),material:Cesium.Color.fromCssColorString('#9a4a3c')}})}
const views={all:[116.2802,39.7472,1450,-28,0],gate:[116.28032,39.7427,560,-20,0],library:[116.28142,39.74472,430,-28,0],teaching:[116.2788,39.7476,500,-32,0],life:[116.27745,39.7494,560,-30,0],sports:[116.2809,39.7502,480,-30,0],college:[116.2831,39.7457,580,-30,0]};
function go(k){const v=views[k];viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(v[0],v[1],v[2]),orientation:{heading:Cesium.Math.toRadians(v[3]),pitch:Cesium.Math.toRadians(-42),roll:0},duration:1.35})}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
(async()=>{try{const [bg,bg2,rg,ag]=await Promise.all([get(L.boundary),get(L.buildings),get(L.roads),get(L.areas)]);const bd=await addGeo(bg,{clampToGround:true,stroke:Cesium.Color.fromCssColorString('#1da7b3'),strokeWidth:4,fill:Cesium.Color.TRANSPARENT});const ad=await addGeo(ag,{clampToGround:true});ad.entities.values.forEach(e=>{if(e.polygon){e.polygon.material=Cesium.Color.fromCssColorString('#70a568').withAlpha(.32);e.polygon.outline=false}});const rd=await addGeo(rg,{clampToGround:true});rd.entities.values.forEach(e=>{if(e.polyline){const h=p(e,'highway');e.polyline.width=/footway|path|pedestrian/.test(h)?2:3.5;e.polyline.material=Cesium.Color.fromCssColorString(/footway|path|pedestrian/.test(h)?'#eee0bc':'#d0ad70').withAlpha(.9);e.polyline.clampToGround=true}});buildings=await addGeo(bg2,{clampToGround:false});let named=0;buildings.entities.values.forEach(e=>{if(!e.polygon)return;const n=name(e),c=cls(e),h=height(e);e.polygon.height=0;e.polygon.extrudedHeight=h;e.polygon.material=Cesium.Color.fromCssColorString(colors[c]).withAlpha(.97);e.polygon.outline=true;e.polygon.outlineColor=Cesium.Color.fromCssColorString('#5d554b').withAlpha(.4);if(n){named++;const q=center(e);if(q){e.position=q;e.label=new Cesium.LabelGraphics({text:n,font:'12px Microsoft YaHei',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#20364a').withAlpha(.82),pixelOffset:new Cesium.Cartesian2(0,-10),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,1050),disableDepthTestDistance:1200})}}});campusComposition();document.getElementById('bc').textContent=bg2.features.length;document.getElementById('rc').textContent=rg.features.length;document.getElementById('ac').textContent=ag.features.length;document.getElementById('nc').textContent=named;document.getElementById('note').textContent='本地 OSM 数据已加载 · 建筑位置来自真实 footprint · 可旋转、缩放并使用上方镜头快速浏览校园组团';go('all')}catch(e){document.getElementById('note').textContent='校园数据加载失败：'+e.message;console.error(e)}})();
</script></body></html>
